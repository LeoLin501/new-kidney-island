<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新腎小島 🏝️</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --sky: #b8e4f7;
  --grass: #7ec850;
  --grass2: #5aab2e;
  --sand: #f5e6c8;
  --wood: #c8903a;
  --wood2: #a06828;
  --wood-light: #e8b86a;
  --cream: #fdf6e3;
  --cream2: #f5ead0;
  --cream3: #ede3c4;
  --brown: #5c3d1e;
  --brown2: #7a5230;
  --text: #3d2b0e;
  --text2: #6b4c28;
  --text3: #967040;
  --teal: #2bb5a0;
  --teal2: #1d8c7a;
  --pink: #f4a7b9;
  --pink2: #e8829a;
  --yellow: #f5d04a;
  --yellow2: #e8b820;
  --green: #52b84a;
  --green2: #3a9030;
  --red: #e05050;
  --shadow: 3px 3px 0px rgba(92,61,30,0.18);
  --shadow2: 2px 2px 0px rgba(92,61,30,0.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Nunito','Noto Sans TC',sans-serif;
  background:var(--sky);color:var(--text);
  min-height:100vh;overflow-x:hidden;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:linear-gradient(180deg,#b8e4f7 0%,#d6f0fb 40%,#e8f5d8 70%,#c8e8a0 100%);
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes drift{from{transform:translateX(-220px)}to{transform:translateX(110vw)}}
@keyframes pop{0%{transform:scale(0.5);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes slide-up{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}

.screen{display:none;position:relative;z-index:1;}
.screen.active{display:block;min-height:100vh;}

/* ── Clouds ── */
.cloud{position:fixed;z-index:0;background:white;border-radius:50px;opacity:0.7;animation:drift linear infinite;}
.cloud::before,.cloud::after{content:'';position:absolute;background:white;border-radius:50%;}

/* ── Deco ── */
.deco{position:fixed;z-index:0;pointer-events:none;opacity:0.65;}

/* ════ TITLE ════ */
#screen-title{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:100vh;padding:40px 20px;text-align:center;
}
.title-sign{
  background:var(--wood-light);border:3px solid var(--wood2);
  border-radius:18px;padding:22px 36px;
  box-shadow:var(--shadow),0 6px 0 var(--wood2);
  margin-bottom:10px;animation:bob 3s ease-in-out infinite;
}
.title-main{
  display:block;font-size:clamp(30px,8vw,50px);font-weight:900;
  color:var(--brown);letter-spacing:3px;
  text-shadow:2px 2px 0 rgba(255,255,255,0.45);
}
.title-sub{display:block;font-size:14px;font-weight:700;color:var(--brown2);letter-spacing:1.5px;margin-top:4px;}
.name-wrap{
  background:var(--cream);border:3px solid var(--cream3);
  border-radius:20px;padding:18px 24px;
  box-shadow:var(--shadow);margin:16px 0;width:100%;max-width:320px;
}
.name-label{font-size:12px;font-weight:900;color:var(--text2);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.name-input{
  background:var(--cream2);border:3px solid var(--cream3);
  border-radius:12px;font-family:'Nunito',sans-serif;
  font-size:17px;font-weight:700;color:var(--text);
  padding:9px 14px;width:100%;text-align:center;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.name-input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(43,181,160,0.22);}
.btn-start{
  background:var(--teal);border:3px solid var(--teal2);
  border-radius:50px;box-shadow:0 5px 0 var(--teal2);
  color:white;font-family:'Nunito',sans-serif;
  font-size:19px;font-weight:900;padding:13px 44px;
  cursor:pointer;letter-spacing:2px;
  transition:transform .1s,box-shadow .1s;
  display:flex;align-items:center;gap:8px;
}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--teal2);}
.btn-start:active{transform:translateY(4px);box-shadow:0 1px 0 var(--teal2);}
.title-info{
  max-width:340px;font-size:13px;font-weight:600;
  color:var(--text2);line-height:1.9;
  background:rgba(255,255,255,0.72);border:2px solid rgba(255,255,255,0.9);
  border-radius:16px;padding:14px 18px;margin-top:18px;
}

/* ════ MAP ════ */
#screen-map{padding-bottom:60px;}
.map-header{
  background:var(--teal);border-bottom:4px solid var(--teal2);
  padding:13px 18px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:20;
}
.map-logo{font-size:19px;font-weight:900;color:white;letter-spacing:1px;text-shadow:1px 1px 0 rgba(0,0,0,0.18);}
.player-pill{
  background:rgba(255,255,255,0.25);border:2px solid rgba(255,255,255,0.5);
  border-radius:20px;padding:4px 13px;font-size:13px;font-weight:800;color:white;
}
.progress-bar-row{
  background:rgba(255,255,255,0.6);border-bottom:3px solid rgba(255,255,255,0.9);
  padding:10px 18px;display:flex;align-items:center;gap:10px;
}
.prog-track{flex:1;height:13px;background:rgba(0,0,0,0.1);border-radius:20px;border:2px solid rgba(0,0,0,0.07);overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--yellow));border-radius:20px;transition:width .6s cubic-bezier(0.34,1.56,0.64,1);}
.prog-label{font-size:12px;font-weight:800;color:var(--text2);white-space:nowrap;}
.map-hint{padding:14px 18px 0;text-align:center;}
.map-hint-sign{
  display:inline-block;background:var(--wood-light);border:2px solid var(--wood2);
  border-radius:10px;padding:6px 18px;font-size:13px;font-weight:800;
  color:var(--brown);box-shadow:2px 2px 0 var(--wood2);margin-bottom:14px;
}
.zone-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:14px;padding:14px 18px;
}
.ztile{
  background:var(--cream);border:3px solid var(--cream3);
  border-radius:22px;box-shadow:var(--shadow),0 4px 0 var(--cream3);
  padding:16px;cursor:pointer;
  transition:transform .15s,box-shadow .15s;
  position:relative;overflow:hidden;
}
.ztile::after{content:'';position:absolute;top:0;left:0;right:0;height:4px;border-radius:22px 22px 0 0;}
.ztile.harbor::after{background:#64c8f0;}
.ztile.transplant::after{background:#f5a0b8;}
.ztile.pd::after{background:#78d878;}
.ztile.home_hd::after{background:#f5c850;}
.ztile.center_hd::after{background:#a090e8;}
.ztile.plaza::after{background:#f0a060;}
.ztile:hover:not(.locked){transform:translateY(-4px);box-shadow:var(--shadow),0 8px 0 var(--cream3);}
.ztile.locked{opacity:0.58;cursor:not-allowed;}
.ztile.done{border-color:#a0d878;background:#f0fae8;}
.ztile.done::before{content:'✓';position:absolute;top:11px;right:13px;font-size:17px;font-weight:900;color:var(--green);}
.ze{font-size:38px;margin-bottom:8px;display:block;animation:bob 3s ease-in-out infinite;}
.ztile-name{font-size:16px;font-weight:900;color:var(--brown);margin-bottom:4px;}
.ztile-desc{font-size:12px;font-weight:600;color:var(--text2);line-height:1.7;margin-bottom:8px;}
.ztile-npcs{font-size:11px;color:var(--text3);margin-bottom:10px;font-weight:600;}
.zbadge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;border-radius:20px;padding:3px 10px;}
.zbadge.done{background:#d8f0b8;color:#2a6810;border:2px solid #a0c878;}
.zbadge.go{background:var(--teal);color:white;border:2px solid var(--teal2);}
.zbadge.lock{background:var(--cream2);color:var(--text3);border:2px solid var(--cream3);}

/* ════ ZONE / PLAZA ════ */
#screen-zone,#screen-plaza{padding-bottom:60px;}
.zone-topbar{
  background:var(--cream);border-bottom:4px solid var(--cream3);
  padding:11px 16px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:20;
}
.btn-back{
  background:var(--wood-light);border:3px solid var(--wood2);border-radius:20px;
  box-shadow:0 3px 0 var(--wood2);font-family:'Nunito',sans-serif;
  font-size:13px;font-weight:800;color:var(--brown);padding:5px 13px;
  cursor:pointer;transition:transform .1s,box-shadow .1s;
}
.btn-back:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--wood2);}
.btn-back:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood2);}
.zone-topbar-title{font-size:16px;font-weight:900;color:var(--brown);}
.zone-body{padding:15px;max-width:680px;margin:0 auto;}

/* Narrative board */
.narrative-board{
  background:var(--wood-light);border:3px solid var(--wood2);
  border-radius:16px;box-shadow:var(--shadow),0 4px 0 var(--wood2);
  padding:16px 18px;margin-bottom:18px;position:relative;
}
.narrative-board::before{content:'📋';position:absolute;top:-14px;left:14px;font-size:19px;background:var(--cream);border-radius:50%;padding:2px;}
.narrative-text{font-size:13px;font-weight:600;color:var(--brown);line-height:1.9;margin-top:4px;font-style:italic;}

/* Dialogue */
.dlg-bubble{display:flex;gap:11px;margin-bottom:11px;animation:slide-up .3s ease;}
.npc-face{width:46px;height:46px;flex-shrink:0;background:var(--cream2);border:3px solid var(--cream3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:var(--shadow2);}
.bubble{background:white;border:3px solid var(--cream3);border-radius:16px 16px 16px 4px;padding:10px 14px;box-shadow:var(--shadow2);flex:1;}
.bubble-name{font-size:11px;font-weight:900;color:var(--teal2);margin-bottom:3px;text-transform:uppercase;letter-spacing:1px;}
.bubble-txt{font-size:13px;font-weight:600;color:var(--text);line-height:1.8;}

/* Info cards */
.sec-hdr{display:flex;align-items:center;gap:7px;margin:14px 0 9px;}
.sec-dot{width:12px;height:12px;border-radius:50%;border:2px solid;}
.sec-label{font-size:12px;font-weight:900;color:var(--text2);letter-spacing:1px;text-transform:uppercase;}
.icards-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px;}
.icard{background:white;border-radius:13px;padding:9px 11px;flex:1;min-width:120px;box-shadow:var(--shadow2);}
.icard.benefit{border:2px solid #b8e8b0;border-top:4px solid var(--green);}
.icard.caution{border:2px solid #f0d0a0;border-top:4px solid #e8a050;}
.icard.basic{border:2px solid #a8dfd8;border-top:4px solid var(--teal);}
.icard-t{font-size:11px;font-weight:900;color:var(--text);margin-bottom:3px;}
.icard-b{font-size:11px;font-weight:600;color:var(--text2);line-height:1.6;}

/* Questions */
.q-block{margin-bottom:16px;}
.q-txt{background:white;border:2px solid var(--cream3);border-radius:13px;padding:11px 13px;margin-bottom:9px;font-size:13px;font-weight:700;color:var(--text);line-height:1.7;box-shadow:var(--shadow2);}
.opts{display:flex;flex-direction:column;gap:6px;}
.opt{
  background:var(--cream2);border:2px solid var(--cream3);border-radius:20px;
  padding:8px 15px;text-align:left;font-family:'Nunito',sans-serif;
  font-size:13px;font-weight:700;color:var(--text2);cursor:pointer;
  box-shadow:0 2px 0 var(--cream3);transition:all .13s;
}
.opt:hover:not(:disabled){background:var(--teal);border-color:var(--teal2);color:white;box-shadow:0 3px 0 var(--teal2);transform:translateY(-1px);}
.opt.sel{background:var(--teal);border-color:var(--teal2);color:white;box-shadow:0 2px 0 var(--teal2);}
.opt:disabled{opacity:.65;cursor:default;}

.btn-ok{
  width:100%;padding:14px;background:var(--green);border:3px solid var(--green2);
  border-radius:50px;box-shadow:0 5px 0 var(--green2);
  font-family:'Nunito',sans-serif;font-size:16px;font-weight:900;
  color:white;cursor:pointer;letter-spacing:1px;
  transition:transform .1s,box-shadow .1s;margin-top:12px;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.btn-ok:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 0 var(--green2);}
.btn-ok:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--green2);}
.btn-ok:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--green2);}
.done-msg{text-align:center;padding:13px;font-size:13px;font-weight:900;color:var(--teal2);background:#e8faf5;border:2px solid #a0e0d0;border-radius:13px;}

/* Plaza */
.jgroup{margin-bottom:22px;}
.jgroup-title{font-size:13px;font-weight:900;color:var(--brown);background:var(--wood-light);border:2px solid var(--wood2);border-radius:9px;padding:4px 13px;display:inline-block;box-shadow:2px 2px 0 var(--wood2);margin-bottom:9px;}
.jcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:7px;}
.jcard{background:white;border-radius:13px;padding:9px 11px;box-shadow:var(--shadow2);}
.jcard.benefit{border:2px solid #b8e8b0;border-top:4px solid var(--green);}
.jcard.caution{border:2px solid #f0d0a0;border-top:4px solid #e8a050;}
.jcard.basic{border:2px solid #a8dfd8;border-top:4px solid var(--teal);}
.jcard-t{font-size:11px;font-weight:900;color:var(--text);margin-bottom:3px;}
.jcard-b{font-size:11px;font-weight:600;color:var(--text2);line-height:1.6;}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px;}
.chip{background:var(--cream2);border:2px solid var(--cream3);border-radius:20px;padding:6px 13px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;color:var(--text2);cursor:pointer;transition:all .13s;box-shadow:0 2px 0 var(--cream3);user-select:none;}
.chip:hover:not(.chip-off){border-color:var(--yellow2);color:var(--brown);transform:translateY(-1px);}
.chip.chip-on{background:var(--yellow);border-color:var(--yellow2);color:var(--brown);box-shadow:0 2px 0 var(--yellow2);}
.chip.chip-off{opacity:.38;cursor:not-allowed;}

.qitem{margin-bottom:15px;}
.q-q{font-size:13px;font-weight:700;color:var(--text);margin-bottom:7px;line-height:1.7;}
.q-q::before{content:'🌿 ';}
.qbtns{display:flex;gap:7px;flex-wrap:wrap;}
.qbtn{background:var(--cream2);border:2px solid var(--cream3);border-radius:20px;padding:6px 13px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;color:var(--text2);cursor:pointer;box-shadow:0 2px 0 var(--cream3);transition:all .13s;}
.qbtn:hover:not(:disabled){border-color:var(--teal);color:var(--teal2);}
.qbtn.qok{background:#d8f0b8;border-color:var(--green);color:#2a7010;box-shadow:0 2px 0 var(--green);}
.qbtn.qno{background:#fde8e8;border-color:var(--red);color:var(--red);}
.qfb{font-size:11px;font-weight:700;color:var(--text2);margin-top:6px;line-height:1.6;}
.qfb::before{content:'💡 ';}

.result-board{
  background:var(--cream);border:3px solid var(--wood2);border-radius:20px;
  box-shadow:var(--shadow),0 5px 0 var(--wood2);padding:22px;margin-bottom:14px;position:relative;
}
.result-board::before{content:'🏆';position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:26px;}
.result-title{font-size:17px;font-weight:900;color:var(--brown);margin-bottom:11px;line-height:1.5;padding-top:8px;text-align:center;}
.rline{font-size:13px;font-weight:700;color:var(--text2);line-height:1.9;margin-bottom:4px;display:flex;gap:5px;}
.rline::before{content:'🌱';flex-shrink:0;font-size:12px;}
.rtags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
.rtag{background:var(--yellow);border:2px solid var(--yellow2);color:var(--brown);border-radius:20px;padding:3px 11px;font-size:11px;font-weight:900;box-shadow:0 2px 0 var(--yellow2);}
.rreco{background:rgba(43,181,160,0.1);border:2px solid rgba(43,181,160,0.3);border-radius:13px;padding:11px 13px;margin-top:11px;}
.rreco-lbl{font-size:11px;font-weight:900;color:var(--teal2);margin-bottom:4px;letter-spacing:1px;}
.rreco-val{font-size:13px;font-weight:800;color:var(--text);}
.radar-c{display:flex;justify-content:center;margin:14px 0;}
.disclaimer{background:#fff8e8;border:2px solid var(--yellow2);border-radius:13px;padding:11px 15px;font-size:12px;font-weight:700;color:var(--text2);line-height:1.8;margin-bottom:14px;}
.disclaimer::before{content:'⚠️ ';}
.btn-dl{
  width:100%;padding:13px;background:var(--pink);border:3px solid var(--pink2);
  border-radius:50px;box-shadow:0 5px 0 var(--pink2);
  font-family:'Nunito',sans-serif;font-size:15px;font-weight:900;
  color:white;cursor:pointer;letter-spacing:1px;
  transition:transform .1s,box-shadow .1s;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.btn-dl:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--pink2);}
.btn-dl:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink2);}

/* Toast */
.toast-wrap{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:100;}
.toast{background:var(--teal);border:3px solid var(--teal2);border-radius:50px;box-shadow:0 4px 0 var(--teal2),0 8px 18px rgba(0,0,0,0.18);color:white;font-size:14px;font-weight:800;padding:9px 22px;transform:translateY(80px);transition:transform .4s cubic-bezier(0.34,1.56,0.64,1);}
.toast.show{transform:translateY(0);}

@media(max-width:480px){.zone-grid{grid-template-columns:1fr;}.jcards{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>

<!-- Clouds -->
<div class="cloud" style="width:80px;height:26px;top:7%;animation-duration:30s;animation-delay:-6s"><div style="position:absolute;width:42px;height:42px;border-radius:50%;background:white;top:-22px;left:14px"></div><div style="position:absolute;width:28px;height:28px;border-radius:50%;background:white;top:-12px;left:40px"></div></div>
<div class="cloud" style="width:58px;height:20px;top:16%;animation-duration:38s;animation-delay:-15s"><div style="position:absolute;width:30px;height:30px;border-radius:50%;background:white;top:-16px;left:10px"></div></div>
<div class="cloud" style="width:100px;height:30px;top:4%;animation-duration:44s;animation-delay:-22s"><div style="position:absolute;width:52px;height:52px;border-radius:50%;background:white;top:-28px;left:18px"></div><div style="position:absolute;width:36px;height:36px;border-radius:50%;background:white;top:-18px;left:52px"></div></div>

<!-- Deco flowers -->
<div class="deco" style="bottom:14%;left:2%;font-size:22px;animation:bob 2.6s ease-in-out infinite">🌸</div>
<div class="deco" style="bottom:11%;left:7%;font-size:20px;animation:bob 3.1s ease-in-out infinite .5s">🌻</div>
<div class="deco" style="bottom:17%;right:3%;font-size:22px;animation:bob 2.9s ease-in-out infinite .9s">🌺</div>
<div class="deco" style="bottom:9%;right:8%;font-size:20px;animation:bob 3.3s ease-in-out infinite .2s">🌼</div>
<div class="deco" style="bottom:20%;left:14%;font-size:16px;animation:bob 2.4s ease-in-out infinite 1.1s">🍄</div>
<div class="deco" style="bottom:22%;right:14%;font-size:16px;animation:bob 2.7s ease-in-out infinite .7s">🌴</div>

<!-- ══ TITLE ══ -->
<div id="screen-title" class="screen active">
  <div class="title-sign">
    <span class="title-main">🏝️ 新腎小島</span>
    <span class="title-sub">腎臟替代治療探索之旅</span>
  </div>
  <div class="name-wrap">
    <div class="name-label">你的島民稱呼</div>
    <input id="name-inp" class="name-input" type="text" placeholder="旅人" maxlength="10">
  </div>
  <button class="btn-start" onclick="startGame()">🍃 出發探島！</button>
  <div class="title-info">
    🌱 這不是要你立刻做決定的地方<br>
    探索六個區域、與島民對話、蒐集知識卡，<br>
    慢慢整理你目前最在意的方向。<br><br>
    <strong style="color:var(--teal2)">建議與醫療團隊和家人一起閱讀摘要。</strong>

</div>

];
const VOPT=['安心感與醫護支持','生活彈性','自主參與','減少打針或看到血的不安','家庭支持','居家安排可行性','我還需要更多資訊'];

const S={
  playerName:'旅人',visited:new Set(),cards:new Set(),
  ans:{},qans:{},vals:[],
  p:{medical_support:0,autonomy:0,flexibility:0,fear_needles:0,family_support:0,home_feasibility:0,self_management_anxiety:0,interest_transplant:0,interest_pd:0,interest_home_hd:0,interest_center_hd:0,decision_anxiety:0,need_more_info:0,long_term_adherence:0},
};
function save(){try{localStorage.setItem('ki_acnh3',JSON.stringify({...S,visited:[...S.visited],cards:[...S.cards]}));}catch(e){}}
function load(){
  try{
    const r=JSON.parse(localStorage.getItem('ki_acnh3')||'null');
    if(!r)return;
    S.playerName=r.playerName||'旅人';S.visited=new Set(r.visited||[]);S.cards=new Set(r.cards||[]);
    S.ans=r.ans||{};S.qans=r.qans||{};S.vals=r.vals||[];S.p={...S.p,...(r.p||{})};
  }catch(e){}
}

function applyZone(k,a){
  const p=S.p,add=(x,v=1)=>{p[x]=(p[x]||0)+v;};
  if(k==='harbor'){
    if(a.h1==='我最怕自己做錯決定')add('decision_anxiety');
    else if(['我知道一些，但還是沒有把握','我很混亂，不知道差別'].includes(a.h1))add('need_more_info');
    if(a.h2==='我希望有人陪著我、比較安心'){add('medical_support');S.cards.add('value_safety');}
    else if(a.h2==='我想保有一些生活彈性'){add('flexibility');S.cards.add('value_flexibility');}
    else if(a.h2==='我很怕醫療操作，像打針或看到血'){add('fear_needles');S.cards.add('value_fear_needles');}
    else{add('need_more_info');S.cards.add('value_more_info');}
  } else if(k==='transplant'){
    ['tx_basic','tx_bq','tx_bs','tx_cw','tx_cd'].forEach(c=>S.cards.add(c));
    if(a.tx1==='生活品質可能比較好')add('interest_transplant',2);else add('need_more_info');
    if(a.tx1==='我擔心等不到腎臟')add('interest_transplant');
    if(a.tx2==='只要生活品質可能更好，我願意配合'){add('interest_transplant');add('long_term_adherence');}
    else if(a.tx2==='我可以接受，但想更了解風險'){add('interest_transplant');add('need_more_info');}
    else if(a.tx2==='我有點擔心自己能不能長期做到')add('self_management_anxiety');
    else add('need_more_info');
  } else if(k==='pd'){
    ['pd_basic','pd_h','pd_f','pd_d','pd_i'].forEach(c=>S.cards.add(c));
    if(a.pd1==='我覺得自己可以慢慢學'){add('interest_pd');add('autonomy');}
    else if(a.pd1==='我喜歡這種自主感'){add('interest_pd',2);add('autonomy',2);add('flexibility');S.cards.add('value_autonomy');}
    else if(a.pd1==='我怕自己做錯')add('self_management_anxiety');
    else add('self_management_anxiety',2);
    if(a.pd2==='我可以配合，只要有人教我')add('interest_pd');
    else if(a.pd2==='我願意做，但怕自己不夠細心')add('self_management_anxiety');
    else if(['我覺得有點麻煩','這讓我有點卻步'].includes(a.pd2)){add('need_more_info');if(a.pd2.includes('卻步'))add('self_management_anxiety');}
  } else if(k==='home_hd'){
    ['hh_basic','hh_f','hh_s','hh_sp','hh_t'].forEach(c=>S.cards.add(c));
    if(a.hh1==='我願意學，這樣比較自由'){add('interest_home_hd',2);add('autonomy',2);add('flexibility');}
    else if(a.hh1==='我需要有人陪我一起學'){add('interest_home_hd');add('family_support');S.cards.add('value_family');}
    else if(a.hh1==='我擔心家裡空間不夠'){add('need_more_info');add('home_feasibility',-1);}
    else add('self_management_anxiety');
    if(a.hh2==='家人願意一起學'){add('family_support',2);add('home_feasibility');}
    else if(a.hh2==='有人願意幫忙，但有限')add('family_support');
    else{add('family_support',-1);add('need_more_info');}
  } else if(k==='center_hd'){
    ['ch_basic','ch_s','ch_e','ch_sc','ch_fat'].forEach(c=>S.cards.add(c));
    if(a.ch1==='有醫護在旁邊比較安心'){add('interest_center_hd',2);add('medical_support',2);}
    else if(a.ch1==='我擔心交通和時間'){add('flexibility');add('need_more_info');}
    else if(a.ch1==='我想知道會不會很累')add('need_more_info');
    else add('flexibility',2);
    if(a.ch2==='現場有人立刻處理'){add('interest_center_hd');add('medical_support',2);S.cards.add('value_safety');}
    else if(a.ch2==='自己先學會判斷也可以')add('autonomy');
    else if(a.ch2==='兩者都很重要'){add('medical_support');add('autonomy');}
    else add('need_more_info');
  }
}

function evaluate(){
  const p=S.p;
  const sc={'腎臟移植':p.interest_transplant+p.long_term_adherence,'腹膜透析':p.autonomy+p.flexibility+p.fear_needles-p.self_management_anxiety+p.interest_pd,'居家血液透析':p.autonomy+p.flexibility+p.family_support+p.home_feasibility-p.self_management_anxiety+p.interest_home_hd,'醫療院所血液透析':p.medical_support+p.interest_center_hd+Math.max(0,Math.floor(p.decision_anxiety/2))};
  const sorted=Object.entries(sc).sort((a,b)=>b[1]-a[1]);
  const top=sorted[0][0],second=sorted[1][0],ts=sorted[0][1],ss=sorted[1][1];
  const tv=['medical_support','autonomy','flexibility','fear_needles','family_support','home_feasibility'].filter(k=>p[k]>0).sort((a,b)=>p[b]-p[a]).slice(0,3).map(k=>({'medical_support':'安心感與醫護支持','autonomy':'自主參與','flexibility':'生活彈性','fear_needles':'減少打針不安','family_support':'家庭支持','home_feasibility':'居家可行性'}[k]));
  if(p.need_more_info>=2||ts-ss<=1)return{title:'你目前還在整理想法，這很正常',summary:['你對不同治療方式都有一些在意的地方，目前還沒有明確偏向。','這不代表你做不好決定，而是你正在認真比較各面向。'],recs:[top,second],tv};
  const m={'醫療院所血液透析':{title:'你目前較重視治療中的安心感與醫護支持',summary:['你似乎較在意治療時有專業人員在旁協助，能即時處理不舒服的情況。','這通常代表你對安全感、穩定感與醫護支持有較高需求。']},'腹膜透析':{title:'你目前較重視生活彈性與自主參與',summary:['你似乎在意治療能否與日常生活整合，也願意考慮自己參與照護。','對你而言，自主性與生活安排可能是很重要的考量。']},'居家血液透析':{title:'你目前具備較高的居家治療支持條件',summary:['你兼顧了生活彈性、自主參與，以及家庭或環境條件的可行性。','居家型治療方式可能值得進一步和醫療團隊詳細討論。']},'腎臟移植':{title:'你目前對腎臟移植有較高的關注與期待',summary:['你對腎臟移植可能帶來的生活品質與長期效果有較高興趣。','你也願意思考長期追蹤與自我管理的可能性。']}};
  return{...m[top],recs:[top,second],tv};
}

function radarSVG(){
  const p=S.p;
  const ax=[{l:'醫護支持',v:Math.min(p.medical_support+p.interest_center_hd,6)},{l:'自主參與',v:Math.min(p.autonomy+p.interest_pd,6)},{l:'生活彈性',v:Math.min(p.flexibility+p.interest_home_hd,6)},{l:'家庭支持',v:Math.min(p.family_support+p.home_feasibility,6)},{l:'移植興趣',v:Math.min(p.interest_transplant+p.long_term_adherence,6)}];
  const N=ax.length,cx=120,cy=120,R=75,max=6,ang=i=>(Math.PI*2/N)*i-Math.PI/2,pt=(i,r)=>[cx+r*Math.cos(ang(i)),cy+r*Math.sin(ang(i))];
  let g='';
  for(let r=1;r<=3;r++){g+=`<polygon points="${ax.map((_,i)=>pt(i,R*r/3).join(',')).join(' ')}" fill="none" stroke="#c8c0a0" stroke-width="1"/>`;}
  g+=ax.map((_,i)=>{const[x,y]=pt(i,R);return`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#c8c0a0" stroke-width="1"/>`;}).join('');
  g+=`<polygon points="${ax.map((a,i)=>pt(i,R*(a.v/max)).join(',')).join(' ')}" fill="rgba(43,181,160,0.22)" stroke="#2bb5a0" stroke-width="2"/>`;
  g+=ax.map((a,i)=>{const[x,y]=pt(i,R*(a.v/max));return`<circle cx="${x}" cy="${y}" r="4" fill="#2bb5a0"/>`;}).join('');
  g+=ax.map((a,i)=>{const[x,y]=pt(i,R+18);return`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#6b4c28" font-family="Nunito,sans-serif" font-weight="700">${a.l}</text>`;}).join('');
  return`<svg width="240" height="240" viewBox="0 0 240 240" style="background:#fff8e8;border-radius:50%;border:3px solid #c8c0a0">${g}</svg>`;
}

function scr(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+id).classList.add('active');window.scrollTo(0,0);}

function startGame(){
  const n=document.getElementById('name-inp').value.trim();
  S.playerName=n||'旅人';save();showMap();
}

function showMap(){
  scr('map');
  document.getElementById('map-pname').textContent='🌿 '+S.playerName;
  const total=ZONES.length+1,done=S.visited.size;
  document.getElementById('prog-fill').style.width=Math.round(done/total*100)+'%';
  document.getElementById('prog-lbl').textContent=`探索 ${done}/${total}`;
  document.getElementById('card-cnt').textContent=`${S.cards.size} 張卡`;
  const grid=document.getElementById('zone-grid');
  grid.innerHTML='';
  const all=[...ZONES.map(z=>({...z})),{key:'plaza',label:'決策廣場',emoji:'🧭',cssClass:'plaza',desc:'回顧資訊卡、完成理解確認，產生個人化摘要。',npcs:['小腎｜回顧與整理']}];
  all.forEach(z=>{
    const done=S.visited.has(z.key),locked=z.key==='plaza'&&S.visited.size<ZONES.length;
    const t=document.createElement('div');
    t.className=`ztile ${z.cssClass||z.key}${done?' done':''}${locked?' locked':''}`;
    if(!locked)t.onclick=()=>goZone(z.key);
    const b=done?`<span class="zbadge done">✓ 已完成</span>`:locked?`<span class="zbadge lock">🔒 完成前五區後開放</span>`:`<span class="zbadge go">出發 →</span>`;
    t.innerHTML=`<span class="ze">${z.emoji}</span><div class="ztile-name">${z.label}</div><div class="ztile-desc">${z.desc}</div><div class="ztile-npcs">島民：${(z.npcs||[]).join('、')}</div>${b}`;
    grid.appendChild(t);
  });
}

function goZone(k){
  if(k==='plaza'){scr('plaza');renderPlaza();return;}
  const z=ZONES.find(x=>x.key===k);if(!z)return;
  scr('zone');
  document.getElementById('zone-title').textContent=z.emoji+' '+z.label;
  renderZone(z);
}

function renderZone(z){
  const done=S.visited.has(z.key);
  const cH=z.cards.length?`<div class="sec-hdr"><div class="sec-dot" style="background:var(--teal);border-color:var(--teal2)"></div><span class="sec-label">本區知識卡</span></div><div class="icards-row">${z.cards.map(id=>{const c=CARDS[id];return`<div class="icard ${c.category}"><div class="icard-t">${c.title}</div><div class="icard-b">${c.content}</div></div>`;}).join('')}</div>`:'';
  const qH=z.qs.map(q=>`<div class="q-block"><div class="q-txt">${q.txt}</div><div class="opts">${q.opts.map(o=>`<button class="opt${S.ans[q.key]===o?' sel':''}" data-k="${q.key}" data-v="${o}" onclick="selOpt(this)"${done?' disabled':''}>${o}</button>`).join('')}</div></div>`).join('');
  const ft=done?`<div class="done-msg">🌟 本區已完成探索！知識卡已加入手冊</div>`:`<button class="btn-ok" id="zok" onclick="doneZone('${z.key}')" disabled>🍀 完成「${z.label}」任務！</button>`;
  document.getElementById('zone-body').innerHTML=`
    <div class="narrative-board"><div class="narrative-text">${z.narrative}</div></div>
    <div style="margin-bottom:16px">${z.dialogue.map(d=>`<div class="dlg-bubble"><div class="npc-face">${d.av}</div><div class="bubble"><div class="bubble-name">${d.speaker}</div><div class="bubble-txt">${d.text}</div></div></div>`).join('')}</div>
    ${cH}
    <div class="sec-hdr" style="margin-top:6px"><div class="sec-dot" style="background:var(--yellow);border-color:var(--yellow2)"></div><span class="sec-label">對話互動</span></div>
    ${qH}${ft}`;
  if(!done)chkBtn(z);
}

function selOpt(btn){
  const k=btn.dataset.k,v=btn.dataset.v;
  S.ans[k]=v;
  document.querySelectorAll(`[data-k="${k}"]`).forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  const z=ZONES.find(x=>x.qs.some(q=>q.key===k));
  if(z)chkBtn(z);
}
function chkBtn(z){const b=document.getElementById('zok');if(b)b.disabled=!z.qs.every(q=>S.ans[q.key]);}

function doneZone(k){
  const z=ZONES.find(x=>x.key===k);
  applyZone(k,S.ans);S.visited.add(k);save();
  toast(`🌟「${z.label}」探索完成！`);
  setTimeout(()=>showMap(),1500);
}

function renderPlaza(){
  const done=S.visited.has('plaza');
  const groups=[{l:'🌄 腎臟移植',g:'transplant'},{l:'🌿 腹膜透析',g:'peritoneal_dialysis'},{l:'🏠 居家血液透析',g:'home_hd'},{l:'🏥 醫療院所血液透析',g:'center_hd'},{l:'⭐ 我的在意卡',g:'player_values'}];
  const jH=groups.map(({l,g})=>{
    const cs=[...S.cards].map(id=>CARDS[id]).filter(c=>c&&c.group===g);
    if(!cs.length)return'';
    return`<div class="jgroup"><div class="jgroup-title">${l}</div><div class="jcards">${cs.map(c=>`<div class="jcard ${c.category}"><div class="jcard-t">${c.title}</div><div class="jcard-b">${c.content}</div></div>`).join('')}</div></div>`;
  }).join('')||'<div style="font-size:13px;font-weight:700;color:var(--text3);margin-bottom:18px">完成各區域後卡片會顯示在這裡 🌱</div>';
  const cH=VOPT.map(v=>{const on=S.vals.includes(v),dis=!on&&S.vals.length>=3;return`<span class="chip${on?' chip-on':''}${dis?' chip-off':''}" onclick="togVal('${v}')">${v}</span>`;}).join('');
  const qH=QUIZ.map((q,i)=>{const a=S.qans['q'+i];return`<div class="qitem"><div class="q-q">${q.q}</div><div class="qbtns">${q.choices.map((c,ci)=>`<button class="qbtn${a!==undefined?(ci===q.correct?' qok':ci===a?' qno':''):''}" onclick="ansQ(${i},${ci})"${a!==undefined?' disabled':''}>${c}</button>`).join('')}</div>${a!==undefined&&a!==q.correct?`<div class="qfb">${q.exp}</div>`:''}</div>`;}).join('');
  let rH='';
  if(done){
    const r=evaluate();
    rH=`<div class="sec-hdr"><div class="sec-dot" style="background:var(--pink);border-color:var(--pink2)"></div><span class="sec-label">你的個人化摘要</span></div>
    <div class="result-board">
      <div class="result-title">${r.title}</div>
      ${r.summary.map(s=>`<div class="rline">${s}</div>`).join('')}
      <div class="rtags">${(r.tv||[]).map(v=>`<span class="rtag">${v}</span>`).join('')}</div>
      <div class="rreco"><div class="rreco-lbl">🌟 你可能想優先進一步了解</div><div class="rreco-val">${r.recs.join(' / ')}</div></div>
    </div>
    <div class="radar-c">${radarSVG()}</div>
    <div class="disclaimer">本遊戲僅供教育參考用途，結果反映你目前的想法，不能取代醫師、護理師與醫療團隊的個別化評估與建議。請攜帶此摘要與你的醫療團隊和家人進一步討論。</div>
    <button class="btn-dl" onclick="dlSum()">🎀 下載我的決策摘要</button>`;
  }
  document.getElementById('plaza-body').innerHTML=`
    <div class="sec-hdr"><div class="sec-dot" style="background:var(--wood);border-color:var(--wood2)"></div><span class="sec-label">我的知識手冊</span></div>
    ${jH}
    <div class="sec-hdr"><div class="sec-dot" style="background:var(--yellow);border-color:var(--yellow2)"></div><span class="sec-label">再選一次你最重視的面向（最多 3 項）</span></div>
    <div class="chips" id="chips">${cH}</div>
    <div class="sec-hdr"><div class="sec-dot" style="background:var(--green);border-color:var(--green2)"></div><span class="sec-label">理解確認</span></div>
    <div id="quiz">${qH}</div>
    ${!done?`<button class="btn-ok" onclick="donePlaza()" style="margin-top:12px">🌟 產生我的決策摘要！</button>`:''}
    <div id="result">${rH}</div>`;
}

function togVal(v){
  if(S.visited.has('plaza'))return;
  const i=S.vals.indexOf(v);
  if(i>=0)S.vals.splice(i,1);else if(S.vals.length<3)S.vals.push(v);else return;
  renderPlaza();
}
function ansQ(qi,ci){
  if(S.qans['q'+qi]!==undefined)return;
  S.qans['q'+qi]=ci;save();renderPlaza();
}
function donePlaza(){
  const m={'安心感與醫護支持':'medical_support','生活彈性':'flexibility','自主參與':'autonomy','減少打針或看到血的不安':'fear_needles','家庭支持':'family_support','居家安排可行性':'home_feasibility','我還需要更多資訊':'need_more_info'};
  S.vals.forEach(v=>{if(m[v])S.p[m[v]]++;});
  S.visited.add('plaza');save();toast('🎉 摘要已產生！');setTimeout(()=>renderPlaza(),500);
}
function dlSum(){
  const r=evaluate();
  const qs=QUIZ.filter((_,i)=>S.qans['q'+i]===QUIZ[i].correct).length;
  const cs=[...S.cards].map(id=>CARDS[id]).filter(Boolean);
  const ln=['新腎小島｜個人化決策摘要','='.repeat(28),`島民稱呼：${S.playerName}`,'','一、你目前較在意的方向',r.title,'','二、摘要',...r.summary.map(s=>'・'+s),'','三、你較在意的面向',...(r.tv||[]).map(v=>'・'+v),'','四、你可能想優先進一步了解',...r.recs.map(x=>'・'+x),'','五、已收集的知識卡',...cs.map(c=>`・${c.title}：${c.content}`),'','六、理解確認',`・答對題數：${qs} / ${QUIZ.length}`,'','='.repeat(28),'⚠ 本摘要僅供教育參考，不取代醫師的個別化評估。','  建議攜帶此摘要與醫療團隊和家人進一步討論。'];
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([ln.join('\n')],{type:'text/plain;charset=utf-8'}));
  a.download=`新腎小島_${S.playerName}_摘要.txt`;a.click();
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}

load();
if(S.visited.size>0)document.getElementById('name-inp').value=S.playerName;
</script>
</body>
</html>
