<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新腎小島 🏝️ 闖關版</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --wood:#c8903a;--wood2:#a06828;--woodl:#e8b86a;
  --cream:#fdf6e3;--cream2:#f5ead0;--cream3:#ede3c4;
  --brown:#5c3d1e;--brown2:#7a5230;
  --text:#3d2b0e;--text2:#6b4c28;--text3:#967040;
  --teal:#2bb5a0;--teal2:#1d8c7a;
  --pink:#f4a7b9;--pink2:#e8829a;
  --yellow:#f5d04a;--yellow2:#e8b820;
  --green:#52b84a;--green2:#3a9030;
  --red:#e05050;--orange:#e8a050;--orange2:#c07830;
  --purple:#a080e8;--purple2:#7858c8;
  --sh:3px 3px 0 rgba(92,61,30,.18);--sh2:2px 2px 0 rgba(92,61,30,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito','Noto Sans TC',sans-serif;background:#b8e4f7;color:var(--text);overflow:hidden;}
.screen{display:none;position:fixed;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;
  background:linear-gradient(180deg,#b8e4f7 0%,#d6f0fb 38%,#e8f5d8 68%,#c8e8a0 100%);}
.screen.active{display:block;}
#screen-title.active{display:flex;flex-direction:column;align-items:center;justify-content:center;}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(110vw)}}
@keyframes slide-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes npc-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes blink{0%,88%,100%{transform:scaleY(1)}91%,96%{transform:scaleY(.08)}}
@keyframes talk{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.8) translateY(-1px)}}
@keyframes card-in{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes boss-appear{from{opacity:0;transform:scale(0.6) translateY(30px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes key-pop{0%{transform:scale(0) rotate(-30deg);opacity:0}60%{transform:scale(1.3) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes unlock-flash{0%,100%{box-shadow:var(--sh),0 4px 0 var(--cream3)}50%{box-shadow:0 0 0 6px rgba(82,184,74,.4),var(--sh),0 4px 0 var(--cream3)}}
@keyframes bounce-in{0%{transform:scale(0.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes star-spin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.2)}100%{transform:rotate(360deg) scale(1)}}
@keyframes hp-drain{from{width:var(--prev-hp)}to{width:var(--cur-hp)}}
@keyframes victory-bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes float-up{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-60px)}}

.cloud{position:fixed;z-index:0;background:#fff;border-radius:50px;opacity:.65;animation:drift linear infinite;pointer-events:none;}
.deco{position:fixed;z-index:0;pointer-events:none;opacity:.6;animation:bob ease-in-out infinite;}

/* ─── TITLE ─── */
#screen-title{min-height:100vh;padding:32px 20px 60px;text-align:center;overflow-y:auto;}

.title-sign{background:var(--woodl);border:3px solid var(--wood2);border-radius:18px;padding:22px 36px;box-shadow:var(--sh),0 6px 0 var(--wood2);margin-bottom:12px;animation:bob 3s ease-in-out infinite;}
.title-main{display:block;font-size:clamp(28px,8vw,48px);font-weight:900;color:var(--brown);letter-spacing:3px;text-shadow:2px 2px 0 rgba(255,255,255,.45);}
.title-sub{display:block;font-size:14px;font-weight:700;color:var(--brown2);letter-spacing:1.5px;margin-top:4px;}
.title-badge{display:inline-block;background:var(--yellow);border:2px solid var(--yellow2);border-radius:20px;padding:3px 14px;font-size:12px;font-weight:900;color:var(--brown);margin-top:8px;box-shadow:0 2px 0 var(--yellow2);}
.name-wrap{background:var(--cream);border:3px solid var(--cream3);border-radius:20px;padding:18px 24px;box-shadow:var(--sh);margin:14px 0;width:100%;max-width:300px;}
.name-label{font-size:11px;font-weight:900;color:var(--text2);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.name-input{background:var(--cream2);border:3px solid var(--cream3);border-radius:12px;font-family:'Nunito',sans-serif;font-size:17px;font-weight:700;color:var(--text);padding:9px 14px;width:100%;text-align:center;outline:none;transition:border-color .2s;}
.name-input:focus{border-color:var(--teal);}
.btn-start{background:var(--teal);border:3px solid var(--teal2);border-radius:50px;box-shadow:0 5px 0 var(--teal2);color:#fff;font-family:'Nunito',sans-serif;font-size:19px;font-weight:900;padding:13px 44px;cursor:pointer;letter-spacing:2px;transition:transform .1s,box-shadow .1s;display:flex;align-items:center;gap:8px;}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--teal2);}
.btn-start:active{transform:translateY(4px);box-shadow:0 1px 0 var(--teal2);}
.title-info{max-width:320px;font-size:13px;font-weight:600;color:var(--text2);line-height:1.9;background:rgba(255,255,255,.72);border:2px solid rgba(255,255,255,.9);border-radius:16px;padding:14px 18px;margin-top:16px;}

/* ─── MAP ─── */
#screen-map{padding-bottom:60px;}
.map-hdr{background:var(--teal);border-bottom:4px solid var(--teal2);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
.map-logo{font-size:18px;font-weight:900;color:#fff;letter-spacing:1px;}
.map-right{display:flex;align-items:center;gap:8px;}
.player-pill{background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.5);border-radius:20px;padding:4px 13px;font-size:13px;font-weight:800;color:#fff;}
.btn-reset{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:800;color:#fff;cursor:pointer;transition:background .15s;}
.btn-reset:hover{background:rgba(255,255,255,.35);}
.btn-fontsize{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:800;color:#fff;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-fontsize:hover{background:rgba(255,255,255,.38);}
.prog-row{background:rgba(255,255,255,.6);border-bottom:3px solid rgba(255,255,255,.9);padding:10px 18px;display:flex;align-items:center;gap:10px;}
.prog-track{flex:1;height:13px;background:rgba(0,0,0,.1);border-radius:20px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--yellow));border-radius:20px;transition:width .6s cubic-bezier(.34,1.56,.64,1);}
.prog-lbl{font-size:12px;font-weight:800;color:var(--text2);white-space:nowrap;}

/* KEY DISPLAY ROW */
.key-row{background:rgba(255,255,255,.5);border-bottom:2px solid rgba(255,255,255,.8);padding:8px 18px;display:flex;align-items:center;gap:6px;}
.key-row-lbl{font-size:11px;font-weight:900;color:var(--text2);letter-spacing:1px;text-transform:uppercase;margin-right:6px;}
.key-icon{font-size:20px;display:inline-block;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.2));}
.key-icon.locked{filter:grayscale(1) opacity(0.35);}
.key-count{font-size:12px;font-weight:900;color:var(--yellow2);margin-left:4px;}

.map-hint{padding:14px 18px 0;text-align:center;}
.hint-sign{display:inline-block;background:var(--woodl);border:2px solid var(--wood2);border-radius:10px;padding:6px 18px;font-size:13px;font-weight:800;color:var(--brown);box-shadow:2px 2px 0 var(--wood2);margin-bottom:12px;}
.zone-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding:14px 18px;}
.ztile{background:var(--cream);border:3px solid var(--cream3);border-radius:22px;box-shadow:var(--sh),0 4px 0 var(--cream3);padding:16px;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden;}
.ztile::after{content:'';position:absolute;top:0;left:0;right:0;height:4px;border-radius:22px 22px 0 0;}
.ztile.harbor::after{background:#64c8f0;}.ztile.transplant::after{background:#f5a0b8;}
.ztile.pd::after{background:#78d878;}.ztile.home_hd::after{background:#f5c850;}
.ztile.center_hd::after{background:#a090e8;}.ztile.plaza::after{background:#f0a060;}
.ztile:hover:not(.locked){transform:translateY(-4px);box-shadow:var(--sh),0 8px 0 var(--cream3);}
.ztile.locked{opacity:.55;cursor:not-allowed;}
.ztile.done{border-color:#a0d878;background:#f0fae8;}
.ztile.done::before{content:'✓';position:absolute;top:10px;right:12px;font-size:17px;font-weight:900;color:var(--green);}
.ztile.unlocked-anim{animation:unlock-flash .8s ease 3;}
.ze{font-size:36px;margin-bottom:8px;display:block;animation:bob 3s ease-in-out infinite;}
.ztile-name{font-size:15px;font-weight:900;color:var(--brown);margin-bottom:4px;}
.ztile-desc{font-size:12px;font-weight:600;color:var(--text2);line-height:1.7;margin-bottom:8px;}
.ztile-npcs{font-size:11px;color:var(--text3);margin-bottom:10px;}
.zbadge{display:inline-flex;align-items:center;font-size:11px;font-weight:800;border-radius:20px;padding:3px 10px;}
.zbadge.done{background:#d8f0b8;color:#2a6810;border:2px solid #a0c878;}
.zbadge.go{background:var(--teal);color:#fff;border:2px solid var(--teal2);}
.zbadge.lock{background:var(--cream2);color:var(--text3);border:2px solid var(--cream3);}
.zbadge.boss{background:var(--red);color:#fff;border:2px solid #c03030;animation:bob 1.5s ease-in-out infinite;}

/* ─── ZONE HEADER ─── */
#screen-zone,#screen-plaza{padding-bottom:60px;}
.zone-topbar{background:var(--cream);border-bottom:4px solid var(--cream3);padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;}
.btn-back{background:var(--woodl);border:3px solid var(--wood2);border-radius:20px;box-shadow:0 3px 0 var(--wood2);font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:var(--brown);padding:5px 13px;cursor:pointer;transition:transform .1s,box-shadow .1s;}
.btn-back:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--wood2);}
.btn-back:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood2);}
.topbar-title{font-size:15px;font-weight:900;color:var(--brown);flex:1;}
.btn-zone-reset{background:rgba(232,131,109,.15);border:2px solid rgba(232,131,109,.4);border-radius:20px;padding:4px 11px;font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;color:#c06040;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-zone-reset:hover{background:rgba(232,131,109,.28);border-color:rgba(232,131,109,.7);}
.zone-progress-bar{background:rgba(255,255,255,.5);padding:6px 16px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;color:var(--text2);border-bottom:2px solid rgba(255,255,255,.7);}
.zone-step-dots{display:flex;gap:4px;}
.zone-step-dot{width:8px;height:8px;border-radius:50%;background:var(--cream3);border:2px solid var(--cream2);}
.zone-step-dot.cur{background:var(--teal);border-color:var(--teal2);}
.zone-step-dot.done{background:var(--green);border-color:var(--green2);}
.zone-body{padding:14px;max-width:680px;margin:0 auto;}
.narrative-board{background:var(--woodl);border:3px solid var(--wood2);border-radius:16px;box-shadow:var(--sh),0 4px 0 var(--wood2);padding:16px 18px;margin-bottom:18px;position:relative;}
.narrative-board::before{content:'📋';position:absolute;top:-13px;left:14px;font-size:18px;background:var(--cream);border-radius:50%;padding:2px;}
.narrative-txt{font-size:13px;font-weight:600;color:var(--brown);line-height:1.9;margin-top:4px;font-style:italic;}
.sec-hdr{display:flex;align-items:center;gap:7px;margin:16px 0 10px;}
.sec-dot{width:11px;height:11px;border-radius:50%;border:2px solid;}
.sec-lbl{font-size:11px;font-weight:900;color:var(--text2);letter-spacing:1px;text-transform:uppercase;}

/* ─── FLIP CARDS ─── */
.flip-section{margin-bottom:22px;}
.flip-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.flip-nav-label{font-size:11px;font-weight:900;color:var(--text2);letter-spacing:1px;text-transform:uppercase;flex:1;min-width:80px;}
.flip-dots{display:flex;gap:5px;}
.flip-dot{width:9px;height:9px;border-radius:50%;background:var(--cream3);border:2px solid var(--cream2);cursor:pointer;transition:all .2s;}
.flip-dot.active{background:var(--teal);border-color:var(--teal2);transform:scale(1.25);}
.flip-btn{background:var(--cream2);border:2px solid var(--cream3);border-radius:20px;padding:5px 14px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;color:var(--text2);cursor:pointer;box-shadow:0 2px 0 var(--cream3);transition:all .13s;}
.flip-btn:hover:not(:disabled){border-color:var(--teal);color:var(--teal2);}
.flip-btn:disabled{opacity:.35;cursor:default;}
.kcard{background:var(--cream);border:3px solid var(--cream3);border-radius:20px;overflow:hidden;animation:card-in .28s ease;position:relative;
  box-shadow:var(--sh),0 4px 0 var(--cream3),6px 6px 0 rgba(180,160,120,.18);}
.kcard-top{padding:18px 18px 12px;display:flex;align-items:flex-start;gap:14px;}
.kcard-icon{width:64px;height:64px;flex-shrink:0;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;}
.kcard-icon.basic{background:#d8f4f0;border:2px solid #a8e0d8;}
.kcard-icon.benefit{background:#ddf4d8;border:2px solid #a8d8a0;}
.kcard-icon.caution{background:#fdf0d8;border:2px solid #e8c880;}
.kcard-meta{flex:1;}
.kcard-type{font-size:10px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px;}
.kcard-type.basic{color:var(--teal2);}
.kcard-type.benefit{color:var(--green2);}
.kcard-type.caution{color:var(--orange2);}
.kcard-title{font-size:17px;font-weight:900;color:var(--brown);line-height:1.3;}
.kcard-divider{height:2px;background:var(--cream3);margin:0 18px;}
.kcard-body{padding:14px 18px 18px;}
.kcard-desc{font-size:13px;font-weight:600;color:var(--text);line-height:1.9;margin-bottom:12px;}
.pc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pc-col{border-radius:12px;padding:10px 12px;}
.pc-col.pros{background:#eaf8e4;border:2px solid #a8d8a0;}
.pc-col.cons{background:#fef3e4;border:2px solid #e8c880;}
.pc-hdr{font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.pc-col.pros .pc-hdr{color:var(--green2);}
.pc-col.cons .pc-hdr{color:var(--orange2);}
.pc-item{font-size:12px;font-weight:700;color:var(--text2);line-height:1.6;padding-left:14px;position:relative;margin-bottom:3px;}
.pc-item::before{position:absolute;left:0;top:1px;}
.pc-col.pros .pc-item::before{content:'✓';color:var(--green);}
.pc-col.cons .pc-item::before{content:'!';color:var(--orange);}
.kcard-scene{font-size:12px;font-weight:700;color:var(--teal2);background:#e8faf6;border-radius:8px;padding:6px 10px;margin-bottom:10px;line-height:1.6;}
.kcard-scene::before{content:'🌿 生活中的樣子：';}

/* ─── BOSS BATTLE ─── */
.boss-arena{background:linear-gradient(135deg,#1a0a30 0%,#2d1060 50%,#1a0a30 100%);border:4px solid #a080e8;border-radius:24px;padding:20px;margin-bottom:18px;position:relative;overflow:hidden;box-shadow:0 0 30px rgba(160,128,232,.4),var(--sh);}
.boss-arena::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");pointer-events:none;}
.boss-title-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.boss-title-badge{background:linear-gradient(135deg,#ff6060,#cc2020);border:2px solid #ff8080;border-radius:20px;padding:3px 12px;font-size:11px;font-weight:900;color:#fff;letter-spacing:1px;text-shadow:1px 1px 0 rgba(0,0,0,.4);}
.boss-title-txt{font-size:16px;font-weight:900;color:#fff;text-shadow:0 0 12px rgba(160,128,232,.8);}
.boss-fight-row{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px;}
.boss-npc-wrap{flex-shrink:0;animation:boss-appear .5s cubic-bezier(.34,1.56,.64,1);}
.boss-npc-wrap svg{filter:drop-shadow(0 0 8px rgba(160,128,232,.7));}
.boss-speech-wrap{flex:1;}
.boss-hp-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.boss-hp-lbl{font-size:10px;font-weight:900;color:#ff9090;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;}
.boss-hp-track{flex:1;height:12px;background:rgba(255,255,255,.15);border-radius:20px;overflow:hidden;border:2px solid rgba(255,255,255,.2);}
.boss-hp-fill{height:100%;background:linear-gradient(90deg,#ff4444,#ff9944);border-radius:20px;transition:width .6s ease;}
.boss-speech{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);border-radius:14px 14px 14px 4px;padding:12px 16px;backdrop-filter:blur(4px);}
.boss-npc-name{font-size:10px;font-weight:900;color:#c0a0ff;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.boss-q{font-size:14px;font-weight:700;color:#fff;line-height:1.7;}
.boss-opts{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.boss-opt{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);border-radius:16px;padding:11px 16px;text-align:left;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:#ffe;cursor:pointer;transition:all .15s;backdrop-filter:blur(2px);}
.boss-opt:hover:not(:disabled){background:rgba(160,128,232,.35);border-color:#c0a0ff;color:#fff;transform:translateX(4px);}
.boss-opt:active{transform:translateX(2px);}
.boss-opt.correct{background:rgba(82,184,74,.3);border-color:#78d878;color:#b8ffb0;}
.boss-opt.wrong{background:rgba(224,80,80,.3);border-color:#ff8080;color:#ffb0b0;animation:shake .4s ease;}
.boss-opt:disabled{cursor:default;}
.boss-feedback{margin-top:12px;background:rgba(245,208,74,.15);border:2px solid rgba(245,208,74,.4);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;color:#ffeea0;line-height:1.7;}
.boss-feedback::before{content:'💡 ';}
.boss-retry-btn{margin-top:10px;width:100%;padding:11px;background:rgba(160,128,232,.3);border:2px solid #c0a0ff;border-radius:20px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:900;color:#fff;cursor:pointer;transition:all .15s;letter-spacing:1px;}
.boss-retry-btn:hover{background:rgba(160,128,232,.5);}

/* BOSS PROGRESS */
.boss-progress-row{display:flex;align-items:center;gap:6px;margin-bottom:12px;}
.boss-q-pip{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:rgba(255,255,255,.4);transition:all .3s;}
.boss-q-pip.done-ok{background:#52b84a;border-color:#78d878;color:#fff;}
.boss-q-pip.active{background:rgba(160,128,232,.5);border-color:#c0a0ff;color:#fff;box-shadow:0 0 8px rgba(160,128,232,.6);}
.boss-q-lbl{font-size:10px;font-weight:900;color:rgba(255,255,255,.5);margin-left:4px;}

/* VICTORY SCREEN */
.victory-overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#1d5a30,#2d8c50,#1d5a30);background-size:400% 400%;animation:victory-bg 3s ease infinite;padding:20px;}
.victory-card{background:var(--cream);border:4px solid var(--yellow2);border-radius:28px;padding:32px 28px;max-width:340px;width:100%;text-align:center;box-shadow:0 0 40px rgba(245,208,74,.5),var(--sh),0 8px 0 var(--wood2);animation:bounce-in .5s cubic-bezier(.34,1.56,.64,1);}
.victory-emoji{font-size:60px;display:block;margin-bottom:8px;animation:star-spin 2s ease-in-out infinite;}
.victory-title{font-size:22px;font-weight:900;color:var(--brown);margin-bottom:6px;}
.victory-sub{font-size:14px;font-weight:700;color:var(--text2);line-height:1.7;margin-bottom:20px;}
.key-reward{display:flex;flex-direction:column;align-items:center;gap:8px;background:linear-gradient(135deg,#fff8e0,#ffe88a);border:3px solid var(--yellow2);border-radius:20px;padding:20px;margin-bottom:20px;box-shadow:0 4px 0 var(--yellow2);}
.key-reward-icon{font-size:52px;animation:key-pop .6s cubic-bezier(.34,1.56,.64,1) forwards;}
.key-reward-txt{font-size:15px;font-weight:900;color:var(--brown);}
.key-reward-sub{font-size:12px;font-weight:700;color:var(--text2);}
.btn-continue{background:var(--teal);border:3px solid var(--teal2);border-radius:50px;box-shadow:0 5px 0 var(--teal2);color:#fff;font-family:'Nunito',sans-serif;font-size:17px;font-weight:900;padding:14px 36px;cursor:pointer;letter-spacing:2px;transition:transform .1s,box-shadow .1s;width:100%;}
.btn-continue:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--teal2);}
.btn-continue:active{transform:translateY(4px);box-shadow:0 1px 0 var(--teal2);}
.victory-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.particle{position:absolute;font-size:24px;animation:float-up 1.5s ease forwards;}

/* ─── NPC Q&A (偏好對話) ─── */
.qa-block{background:#fff;border:2px solid var(--cream3);border-radius:18px;box-shadow:var(--sh2);margin-bottom:14px;overflow:hidden;}
.qa-npc-row{display:flex;align-items:flex-end;gap:0;padding:14px 14px 0;}
.qa-npc-svg{flex-shrink:0;width:58px;animation:bob 2.5s ease-in-out infinite;}
.qa-speech{background:var(--cream2);border:2px solid var(--cream3);border-radius:14px 14px 14px 4px;padding:10px 14px;flex:1;margin-left:10px;margin-bottom:4px;}
.qa-npc-name{font-size:10px;font-weight:900;color:var(--teal2);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;}
.qa-q-txt{font-size:13px;font-weight:700;color:var(--text);line-height:1.7;}
.qa-opts{padding:10px 14px 14px;display:flex;flex-direction:column;gap:6px;}
.opt{background:var(--cream2);border:2px solid var(--cream3);border-radius:20px;padding:10px 16px;text-align:left;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:var(--text2);cursor:pointer;
  box-shadow:0 4px 0 var(--cream3),0 6px 12px rgba(92,61,30,.12);
  transition:all .12s;position:relative;}
.opt:hover:not(:disabled){background:var(--teal);border-color:var(--teal2);color:#fff;box-shadow:0 5px 0 var(--teal2),0 8px 16px rgba(43,181,160,.2);transform:translateY(-2px);}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--teal2);}
.opt.sel{background:var(--teal);border-color:var(--teal2);color:#fff;box-shadow:0 3px 0 var(--teal2),0 5px 12px rgba(43,181,160,.18);transform:translateY(1px);}
.opt:disabled{opacity:.65;cursor:default;}
.btn-ok{width:100%;padding:14px;background:var(--green);border:3px solid var(--green2);border-radius:50px;box-shadow:0 5px 0 var(--green2);font-family:'Nunito',sans-serif;font-size:16px;font-weight:900;color:#fff;cursor:pointer;letter-spacing:1px;transition:transform .1s,box-shadow .1s;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:7px;}
.btn-ok:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 0 var(--green2);}
.btn-ok:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--green2);}
.btn-ok:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--green2);}
.done-msg{text-align:center;padding:13px;font-size:13px;font-weight:900;color:var(--teal2);background:#e8faf5;border:2px solid #a0e0d0;border-radius:13px;}

/* ─── BOSS CHALLENGE NOTICE ─── */
.boss-notice{background:linear-gradient(135deg,#2d1060,#1a0a30);border:3px solid #a080e8;border-radius:20px;padding:18px;margin-bottom:18px;text-align:center;box-shadow:0 0 20px rgba(160,128,232,.3),var(--sh);}
.boss-notice-title{font-size:16px;font-weight:900;color:#fff;margin-bottom:6px;text-shadow:0 0 10px rgba(160,128,232,.8);}
.boss-notice-sub{font-size:12px;font-weight:700;color:#c0a0ff;line-height:1.7;margin-bottom:14px;}
.boss-notice-rules{display:flex;flex-direction:column;gap:6px;text-align:left;margin-bottom:16px;}
.boss-rule{font-size:12px;font-weight:700;color:#e0d0ff;padding-left:20px;position:relative;line-height:1.6;}
.boss-rule::before{position:absolute;left:0;}
.boss-rule.rule-read::before{content:'📚';}
.boss-rule.rule-ans::before{content:'⚔️';}
.boss-rule.rule-retry::before{content:'🔄';}
.boss-rule.rule-key::before{content:'🗝️';}
.btn-boss-start{width:100%;padding:13px;background:linear-gradient(135deg,#8050d0,#6030a8);border:3px solid #c0a0ff;border-radius:50px;box-shadow:0 5px 0 #5030a0,0 0 20px rgba(160,128,232,.4);font-family:'Nunito',sans-serif;font-size:16px;font-weight:900;color:#fff;cursor:pointer;letter-spacing:2px;transition:transform .1s,box-shadow .1s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-boss-start:hover{transform:translateY(-2px);box-shadow:0 7px 0 #5030a0,0 0 28px rgba(160,128,232,.5);}
.btn-boss-start:active{transform:translateY(4px);box-shadow:0 1px 0 #5030a0;}

/* ─── PLAZA ─── */
.plaza-visited{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px;}
.pv-chip{display:flex;align-items:center;gap:5px;background:var(--cream);border:2px solid var(--cream3);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:800;color:var(--text2);box-shadow:var(--sh2);}
.pv-chip.done{background:#eaf8e4;border-color:#a8d8a0;color:#2a6810;}
.pv-dot{width:8px;height:8px;border-radius:50%;}
.val-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:18px;}
.val-btn{background:var(--cream2);border:2px solid var(--cream3);border-radius:14px;padding:9px 12px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;color:var(--text2);cursor:pointer;text-align:center;box-shadow:0 2px 0 var(--cream3);transition:all .13s;line-height:1.4;}
.val-btn:hover:not(.val-off){border-color:var(--yellow2);color:var(--brown);}
.val-btn.val-on{background:var(--yellow);border-color:var(--yellow2);color:var(--brown);box-shadow:0 2px 0 var(--yellow2);}
.val-btn.val-off{opacity:.38;cursor:not-allowed;}
.quiz-wrap{background:#fff;border:2px solid var(--cream3);border-radius:16px;padding:14px;box-shadow:var(--sh2);margin-bottom:14px;}
.quiz-q-txt{font-size:13px;font-weight:700;color:var(--text);margin-bottom:9px;line-height:1.6;}
.qbtns{display:flex;gap:7px;flex-wrap:wrap;}
.qbtn{background:var(--cream2);border:2px solid var(--cream3);border-radius:20px;padding:6px 13px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;color:var(--text2);cursor:pointer;box-shadow:0 2px 0 var(--cream3);transition:all .13s;}
.qbtn:hover:not(:disabled){border-color:var(--teal);color:var(--teal2);}
.qbtn.qok{background:#d8f0b8;border-color:var(--green);color:#2a7010;box-shadow:0 2px 0 var(--green);}
.qbtn.qno{background:#fde8e8;border-color:var(--red);color:var(--red);}
.qfb{font-size:11px;font-weight:700;color:var(--text2);margin-top:7px;line-height:1.6;padding-left:4px;}
.qfb::before{content:'💡 ';}
.result-board{background:var(--cream);border:3px solid var(--wood2);border-radius:20px;box-shadow:var(--sh),0 5px 0 var(--wood2);padding:20px;margin-bottom:14px;position:relative;}
.result-board::before{content:'🏆';position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:26px;}
.result-title{font-size:16px;font-weight:900;color:var(--brown);margin-bottom:10px;line-height:1.5;padding-top:6px;text-align:center;}
.result-summary{font-size:13px;font-weight:600;color:var(--text2);line-height:1.8;margin-bottom:12px;padding:10px 12px;background:rgba(255,255,255,.6);border-radius:10px;}
.result-dir-box{background:#eaf8e4;border:2px solid #a8d8a0;border-radius:12px;padding:12px 14px;margin-bottom:12px;}
.result-dir-lbl{font-size:10px;font-weight:900;color:var(--green2);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;}
.result-dir-txt{font-size:13px;font-weight:700;color:var(--text);line-height:1.7;}
.result-advice-box{background:#fff8e8;border:2px solid var(--yellow2);border-radius:12px;padding:12px 14px;margin-bottom:12px;}
.result-advice-lbl{font-size:10px;font-weight:900;color:var(--orange2);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;}
.result-advice-txt{font-size:13px;font-weight:700;color:var(--text);line-height:1.7;}
.result-reco-row{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 4px;}
.reco-pill{background:var(--teal);border:2px solid var(--teal2);color:#fff;border-radius:20px;padding:5px 14px;font-size:12px;font-weight:900;box-shadow:0 2px 0 var(--teal2);}
.reco-pill.second{background:var(--cream2);border-color:var(--cream3);color:var(--text2);box-shadow:0 2px 0 var(--cream3);}
.rtags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
.rtag{background:var(--yellow);border:2px solid var(--yellow2);color:var(--brown);border-radius:20px;padding:3px 11px;font-size:11px;font-weight:900;box-shadow:0 2px 0 var(--yellow2);}
.radar-c{display:flex;flex-direction:column;align-items:center;margin:12px 0;}
.radar-legend{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--text3);margin-top:6px;}
.radar-legend-dot{width:10px;height:10px;border-radius:50%;background:#2bb5a0;}
.disclaimer{background:#fff8e8;border:2px solid var(--yellow2);border-radius:13px;padding:10px 14px;font-size:11px;font-weight:700;color:var(--text2);line-height:1.7;margin-bottom:14px;}
.disclaimer::before{content:'⚠️ ';}
.radar-annotation{font-size:12px;font-weight:700;color:var(--text2);text-align:center;padding:8px 14px;background:rgba(255,255,255,.6);border-radius:10px;margin-top:8px;line-height:1.6;}
.btn-dl{width:100%;padding:13px;background:var(--pink);border:3px solid var(--pink2);border-radius:50px;box-shadow:0 5px 0 var(--pink2);font-family:'Nunito',sans-serif;font-size:15px;font-weight:900;color:#fff;cursor:pointer;letter-spacing:1px;transition:transform .1s,box-shadow .1s;display:flex;align-items:center;justify-content:center;gap:7px;}
.btn-dl:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--pink2);}
.btn-dl:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink2);}
.btn-print{width:100%;padding:13px;background:#5090e0;border:3px solid #3070c0;border-radius:50px;box-shadow:0 5px 0 #3070c0;font-family:'Nunito',sans-serif;font-size:15px;font-weight:900;color:#fff;cursor:pointer;letter-spacing:1px;transition:transform .1s,box-shadow .1s;display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:10px;}
.btn-print:hover{transform:translateY(-2px);box-shadow:0 7px 0 #3070c0;}

/* KEYS CHEST */
.keys-collected-box{background:linear-gradient(135deg,#fff8e0,#ffe88a);border:3px solid var(--yellow2);border-radius:20px;padding:16px 20px;margin-bottom:18px;box-shadow:0 4px 0 var(--yellow2),var(--sh);}
.keys-collected-title{font-size:11px;font-weight:900;color:var(--brown);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.keys-row{display:flex;gap:10px;flex-wrap:wrap;}
.key-slot{display:flex;flex-direction:column;align-items:center;gap:4px;}
.key-slot-icon{font-size:28px;display:block;}
.key-slot-icon.empty{filter:grayscale(1) opacity(0.3);}
.key-slot-lbl{font-size:10px;font-weight:800;color:var(--text2);text-align:center;max-width:54px;line-height:1.3;}

/* TOAST */
.toast-wrap{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:100;}
.toast{background:var(--teal);border:3px solid var(--teal2);border-radius:50px;box-shadow:0 4px 0 var(--teal2);color:#fff;font-size:14px;font-weight:800;padding:9px 22px;transform:translateY(80px);transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
.toast.show{transform:translateY(0);}


/* FAMILY BOX */
.family-box{background:#f0f8ff;border:2px solid #a8c8f0;border-radius:16px;padding:16px 18px;margin-bottom:14px;}
.family-box-title{font-size:11px;font-weight:900;color:#3070c0;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.family-box-body{font-size:13px;font-weight:600;color:var(--text2);line-height:1.8;}
.family-questions{margin-top:10px;}
.family-q{font-size:12px;font-weight:800;color:#3070c0;padding:5px 0 5px 14px;position:relative;border-bottom:1px solid #d0e4f8;}
.family-q::before{content:'？';position:absolute;left:0;color:#a8c8f0;}
.family-q:last-child{border-bottom:none;}

/* PHASE TRANSITION */
.phase-banner{background:linear-gradient(135deg,#1d5a30,#3a9050);border:3px solid #78d878;border-radius:18px;padding:14px 18px;margin-bottom:18px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 0 #2a7030,var(--sh);}
.phase-banner-icon{font-size:28px;flex-shrink:0;}
.phase-banner-txt{font-size:13px;font-weight:900;color:#fff;line-height:1.6;}
.phase-banner-sub{font-size:11px;font-weight:700;color:#a0f0a0;margin-top:2px;}

@media(max-width:480px){.zone-grid{grid-template-columns:1fr;}.pc-grid{grid-template-columns:1fr;}}
body.large-font .opt,.large-font .qa-q-txt,.large-font .kcard-desc,.large-font .kcard-title,.large-font .boss-q,.large-font .boss-opt{font-size:15px!important;}

@media print{
  .screen{position:static!important;display:block!important;}
  #screen-title,#screen-map,#screen-zone,#screen-plaza{display:none!important;}
  #print-area{display:block!important;}
  .cloud,.deco,.toast-wrap{display:none!important;}
}
#print-area{display:none;padding:20px;}
</style>
</head>
<body>

<!-- Clouds -->
<div class="cloud" style="width:80px;height:26px;top:7%;animation-duration:12s;animation-delay:-2s"><div style="position:absolute;width:42px;height:42px;border-radius:50%;background:#fff;top:-22px;left:14px"></div><div style="position:absolute;width:28px;height:28px;border-radius:50%;background:#fff;top:-12px;left:40px"></div></div>
<div class="cloud" style="width:50px;height:18px;top:20%;animation-duration:9s;animation-delay:-4s"><div style="position:absolute;width:28px;height:28px;border-radius:50%;background:#fff;top:-15px;left:8px"></div></div>
<div class="cloud" style="width:100px;height:30px;top:4%;animation-duration:15s;animation-delay:-7s"><div style="position:absolute;width:52px;height:52px;border-radius:50%;background:#fff;top:-28px;left:18px"></div><div style="position:absolute;width:36px;height:36px;border-radius:50%;background:#fff;top:-18px;left:52px"></div></div>
<div class="cloud" style="width:64px;height:22px;top:12%;animation-duration:10s;animation-delay:-1s"><div style="position:absolute;width:34px;height:34px;border-radius:50%;background:#fff;top:-18px;left:10px"></div><div style="position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:-10px;left:36px"></div></div>
<div class="deco" style="bottom:13%;left:2%;font-size:22px;animation-duration:2.6s">🌸</div>
<div class="deco" style="bottom:10%;left:7%;font-size:20px;animation-duration:3.1s;animation-delay:.5s">🌻</div>
<div class="deco" style="bottom:17%;right:3%;font-size:22px;animation-duration:2.9s;animation-delay:.9s">🌺</div>
<div class="deco" style="bottom:9%;right:8%;font-size:20px;animation-duration:3.3s;animation-delay:.2s">🌼</div>
<div class="deco" style="bottom:21%;left:13%;font-size:16px;animation-duration:2.4s;animation-delay:1.1s">🍄</div>
<div class="deco" style="bottom:23%;right:13%;font-size:16px;animation-duration:2.7s;animation-delay:.7s">🌴</div>

<!-- TITLE -->
<div id="screen-title" class="screen active">
  <div class="title-sign"><span class="title-main">🏝️ 新腎小島</span><span class="title-sub">腎臟替代治療探索之旅</span></div>
  <div class="title-badge">⚔️ 闖關版 — 挑戰關主，收集鑰匙！</div>
  <div class="name-wrap"><div class="name-label">你的島民稱呼</div><input id="name-inp" class="name-input" type="text" placeholder="旅人" maxlength="10"></div>
  <button class="btn-start" onclick="startGame()">🍃 出發探島！</button>
  <div class="title-info">🌱 在每個區域，先閱讀知識卡，<br>再挑戰關主的知識問題！<br>闖關成功可獲得鑰匙 🗝️，集滿五把才能進入決策廣場。<br><br><strong style="color:var(--teal2)">答錯沒關係，看完解說再試一次！</strong></div>
</div>

<!-- PRINT AREA -->
<div id="print-area"></div>

<!-- MAP -->
<div id="screen-map" class="screen">
  <div class="map-hdr">
    <span class="map-logo">🏝️ 新腎小島</span>
    <div class="map-right">
      <span class="player-pill" id="map-pname"></span>
      <button class="btn-fontsize" onclick="toggleFont()" id="font-btn">A+ 大字</button>
      <button class="btn-reset" onclick="resetGame()">↩ 重新開始</button>
    </div>
  </div>
  <div class="prog-row"><span class="prog-lbl" id="prog-lbl">探索進度</span><div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div><span class="prog-lbl" id="card-cnt">0 區</span></div>
  <div class="key-row" id="key-row"></div>
  <div class="map-hint"><div class="hint-sign">🗺️ 點選區域開始探索！集滿 5 把鑰匙解鎖廣場</div></div>

</div>

<!-- ZONE -->
<div id="screen-zone" class="screen">
  <div class="zone-topbar"><button class="btn-back" onclick="showMap()">← 回地圖</button><span class="topbar-title" id="zone-title"></span><button class="btn-zone-reset" onclick="resetZone()">↩ 重設本關</button></div>
  <div class="zone-progress-bar" id="zone-progress-bar"></div>
  <div class="zone-body" id="zone-body"></div>
</div>

<!-- PLAZA -->
<div id="screen-plaza" class="screen">
  <div class="zone-topbar"><button class="btn-back" onclick="showMap()">← 回地圖</button><span class="topbar-title">🧭 決策廣場</span><button class="btn-zone-reset" onclick="resetPlaza()">↩ 重設廣場</button></div>
  <div class="zone-body" id="plaza-body"></div>
</div>

<!-- VICTORY OVERLAY -->
<div id="victory-overlay" class="victory-overlay" style="display:none;">
  <div class="victory-particles" id="victory-particles"></div>
  <div class="victory-card">
    <span class="victory-emoji" id="victory-emoji">🗝️</span>
    <div class="victory-title" id="victory-title">關卡攻略！</div>
    <div class="victory-sub" id="victory-sub">你成功打敗了關主！</div>
    <div class="key-reward">
      <span class="key-reward-icon" id="key-reward-icon">🗝️</span>
      <div class="key-reward-txt" id="key-reward-txt">獲得鑰匙！</div>
      <div class="key-reward-sub" id="key-reward-sub">收集所有鑰匙可解鎖決策廣場</div>
    </div>
    <button class="btn-continue" id="victory-continue-btn">繼續探索 →</button>
  </div>
</div>

<div class="toast-wrap"><div class="toast" id="toast"></div></div>

<script>
// ─────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────
const ZONE_CARDS={
  harbor:[

function freshState(){
  return{
    playerName:'旅人',
    visited:new Set(),   // zones where dialogue is done
    bossCleared:new Set(), // zones where boss is cleared
    ans:{},qans:{},vals:[],flipIdx:{},
    _currentZone:null,_zoneSnap:{},
    // Boss battle state per zone
    bossState:{},  // { [zoneKey]: { qIdx:0, done:false, answers:[...] } }
    p:{medical_support:0,autonomy:0,flexibility:0,fear_needles:0,family_support:0,home_feasibility:0,self_management_anxiety:0,interest_transplant:0,interest_pd:0,interest_home_hd:0,interest_center_hd:0,decision_anxiety:0,need_more_info:0,long_term_adherence:0}
  };
}
let S=freshState();

// Current zone phase: 'cards' | 'boss' | 'dialogue'
let zonePhase='cards';

function resetGame(){
  S=freshState();
  document.getElementById('name-inp').value='';
  scr('title');
  toast('已重新開始 🏝️');
}
function resetZone(){
  const k=S._currentZone;if(!k)return;
  const z=ZONES.find(x=>x.key===k);if(!z)return;
  S.bossCleared.delete(k);
  S.visited.delete(k);
  S.bossState[k]={qIdx:0,done:false,answers:[]};
  S.flipIdx[k]=0;
  // Also reset plaza scoring since zone scores changed
  S.ans={};
  S.qans={};S.vals=[];S.visited.delete('plaza');
  // Reset scoring for this zone
  const snap=S._zoneSnap&&S._zoneSnap[k];
  if(snap){Object.keys(snap).forEach(key=>{S.p[key]=(S.p[key]||0)-snap[key];});delete S._zoneSnap[k];}
  zonePhase='cards';
  renderZone(z);
  document.getElementById('screen-zone').scrollTop=0;
  toast('已重設本關，可以重新挑戰 🌱');
}
function resetPlaza(){S.qans={};S.vals=[];S.visited.delete('plaza');renderPlaza();document.getElementById('screen-plaza').scrollTop=0;toast('已重設決策廣場 🌱');}

function applyZone(k,a){
  const p=S.p,add=(x,v=1)=>{p[x]=(p[x]||0)+v;};
  if(k==='harbor'){
    if(a.h1==='我最怕自己做錯決定')add('decision_anxiety');
    else if(['我有一點了解，但還是沒有把握','我很混亂，不知道不同治療的差別'].includes(a.h1))add('need_more_info');
    if(a.h2==='我希望有人陪著我、比較安心')add('medical_support');
    else if(a.h2==='我想保有一些生活彈性')add('flexibility');
    else if(a.h2==='我很怕醫療操作，像打針或看到血')add('fear_needles');
    else add('need_more_info');
  }else if(k==='transplant'){
    if(a.tx1==='生活品質可能比較好，我有興趣'){add('interest_transplant',2);}else add('need_more_info');
    if(a.tx1==='我擔心等不到合適的腎臟')add('interest_transplant');
    if(a.tx2==='只要生活品質可能更好，我願意配合'){add('interest_transplant');add('long_term_adherence');}
    else if(a.tx2==='我可以接受，但想先了解更多細節'){add('interest_transplant');add('need_more_info');}
    else if(a.tx2==='我有點擔心自己能不能長期做到')add('self_management_anxiety');
    else add('need_more_info');
  }else if(k==='pd'){
    if(a.pd1==='我覺得自己可以慢慢學會'){add('interest_pd');add('autonomy');}
    else if(a.pd1==='我喜歡這種能自己掌控的感覺'){add('interest_pd',2);add('autonomy',2);add('flexibility');}
    else if(a.pd1==='我有點擔心自己會做錯')add('self_management_anxiety');
    else add('self_management_anxiety',2);
    if(a.pd2==='我可以配合，只要有人好好教我')add('interest_pd');
    else if(a.pd2==='我願意做，但怕自己不夠細心')add('self_management_anxiety');
    else{add('need_more_info');if(a.pd2&&a.pd2.includes('卻步'))add('self_management_anxiety');}
  }else if(k==='home_hd'){
    if(a.hh1==='我願意學，這樣生活比較自由'){add('interest_home_hd',2);add('autonomy',2);add('flexibility');}
    else if(a.hh1==='我需要有人陪我一起學才放心'){add('interest_home_hd');add('family_support');}
    else if(a.hh1==='我擔心家裡空間或條件不夠'){add('need_more_info');add('home_feasibility',-1);}
    else add('self_management_anxiety');
    if(a.hh2==='家人願意一起學習、一起承擔'){add('family_support',2);add('home_feasibility');}
    else if(a.hh2==='有人願意幫忙，但能力或時間有限')add('family_support');
    else{add('family_support',-1);add('need_more_info');}
  }else if(k==='center_hd'){
    if(a.ch1==='有醫護人員在旁邊，我比較安心'){add('interest_center_hd',2);add('medical_support',2);}
    else if(a.ch1==='我擔心交通和時間的安排'){add('flexibility');add('need_more_info');}
    else if(a.ch1==='我想知道透析過程會不會很不舒服')add('need_more_info');
    else add('flexibility',2);
    if(a.ch2==='現場有護理師立刻幫我處理'){add('interest_center_hd');add('medical_support',2);}
    else if(a.ch2==='我自己先學會怎麼判斷也可以')add('autonomy');
    else if(a.ch2==='兩種都很重要，最好都有'){add('medical_support');add('autonomy');}
    else add('need_more_info');
  }
}
function evaluate(){
  const p=S.p;
  const itx=p.interest_transplant*2+p.long_term_adherence*2;
  const ipd=p.interest_pd*2+p.autonomy+p.flexibility+p.fear_needles-p.self_management_anxiety;
  const ihhd=p.interest_home_hd*2+p.autonomy+p.flexibility+p.family_support+p.home_feasibility-p.self_management_anxiety;
  const ichd=p.interest_center_hd*2+p.medical_support+Math.max(0,p.decision_anxiety);
  const sc={'腎臟移植':itx,'腹膜透析':ipd,'居家血液透析':ihhd,'醫療院所血液透析':ichd};
  const sorted=Object.entries(sc).sort((a,b)=>b[1]-a[1]);
  const top=sorted[0][0],second=sorted[1][0],ts=sorted[0][1],ss=sorted[1][1];
  const tv=['medical_support','autonomy','flexibility','fear_needles','family_support','home_feasibility']
    .filter(k=>p[k]>0).sort((a,b)=>p[b]-p[a]).slice(0,3)
    .map(k=>({'medical_support':'安心感與醫護支持','autonomy':'自主參與','flexibility':'生活彈性','fear_needles':'減少打針不安','family_support':'家庭支持','home_feasibility':'居家可行性'}[k]));
  const advice={'醫療院所血液透析':'建議你與醫師討論院所血液透析的排程安排，並提前了解附近透析診所的位置與交通方式。可以詢問是否有交通補助資源。','腹膜透析':'建議你向腹膜透析護理師預約衛教，了解換液的實際操作流程，並評估家中的清潔空間是否符合需求。','居家血液透析':'建議先與家人充分討論照顧分工，再請居家透析個管師到家中進行環境評估，了解設備安裝的可行性。','腎臟移植':'建議向移植協調師詢問評估流程與等待清單，同時了解等待期間的透析銜接安排。','mixed':'建議你把今天整理出來的問題帶去門診，和醫師一起逐一討論，不需要急著做決定。'};
  if(p.need_more_info>=2||ts-ss<=1){
    return{style:'mixed',top,second,title:'你目前還在整理自己的想法，這很正常',summary:'你對不同治療方式都有一些在意的地方，目前還沒有明確偏向。這代表你正在認真思考，而不是猶豫不決。',direction:'目前你的回答顯示對「'+top+'」和「'+second+'」都有一定程度的關注，建議進一步了解這兩種選擇的差異。',advice:advice.mixed,recs:[top,second],tv};
  }
  const styleMap={'醫療院所血液透析':{title:'你目前較重視治療時的安心感與醫護支持',summary:'你的回答顯示你在意治療過程有人在旁協助，能即時處理不舒服，這是很合理的需求。',direction:'「醫療院所血液透析」可能較符合你目前的狀況。這個方式由醫護人員全程協助，時間固定，適合重視安全感的人。'},'腹膜透析':{title:'你目前較重視生活彈性與自主參與',summary:'你的回答顯示你在意治療能配合日常作息，也願意學習自己照護，這是很積極的態度。',direction:'「腹膜透析」可能較符合你目前的狀況。這個方式可在家進行，時間彈性，適合重視自主與生活整合的人。'},'居家血液透析':{title:'你目前具備較高的居家治療支持條件',summary:'你的回答顯示你兼具學習意願、生活彈性需求，以及家庭支持的可行性，這是很好的基礎。',direction:'「居家血液透析」可能值得你深入評估。這個方式時間最有彈性，但需要家庭配合和環境準備。'},'腎臟移植':{title:'你目前對腎臟移植有較高的關注與期待',summary:'你的回答顯示你對移植後的生活品質有期待，也願意承擔長期照護的責任，這是很重要的心理準備。',direction:'「腎臟移植」可能是你值得深入了解的方向。這個方式可能帶來最接近一般生活的品質，但需要等待與術後管理。'}};
  const s=styleMap[top];
  return{style:top,top,second,title:s.title,summary:s.summary,direction:s.direction,advice:advice[top]||advice.mixed,recs:[top,second],tv};
}

function renderFlipCards(zoneKey){
  const cards=ZONE_CARDS[zoneKey];
  if(!cards||!cards.length)return'';
  if(S.flipIdx[zoneKey]===undefined)S.flipIdx[zoneKey]=0;
  const idx=S.flipIdx[zoneKey];
  const c=cards[idx];
  const typeLabel={basic:'基本介紹',benefit:'優點',caution:'注意事項'}[c.type]||c.type;
  const dots=cards.map((_,i)=>'<span class="flip-dot'+(i===idx?' active':'')+'" onclick="flipTo(\''+zoneKey+'\','+i+')"></span>').join('');
  const pros=(c.pros||[]).map(t=>'<div class="pc-item">'+t+'</div>').join('');
  const cons=(c.cons||[]).map(t=>'<div class="pc-item">'+t+'</div>').join('');
  const sceneHTML=c.scene?'<div class="kcard-scene">'+c.scene+'</div>':'';
  const allRead=idx===cards.length-1;
  const z=ZONES.find(x=>x.key===zoneKey);
  // 最後一張：noBoss 顯示「獲得鑰匙」，否則顯示「挑戰關主」
  let lastBtnHTML='';
  if(allRead){
    if(z&&z.noBoss){
      lastBtnHTML='<button class="btn-boss-start" onclick="harborComplete(\''+zoneKey+'\')" style="width:100%;margin-top:12px;background:linear-gradient(135deg,#e8b820,#c8901a);border-color:var(--yellow2);box-shadow:0 5px 0 var(--yellow2)">'+z.keyEmoji+' 知識卡已讀完，獲得'+z.keyLabel+'！</button>';
    }else{
      lastBtnHTML='<button class="btn-boss-start" onclick="startBossPhase(\''+zoneKey+'\')" style="width:100%;margin-top:12px">⚔️ 知識卡已讀完，挑戰關主！</button>';
    }
  }
  return[
    '<div class="flip-section">',
    '<div class="flip-nav">',
    '<span class="flip-nav-label">📚 知識卡 '+(idx+1)+'/'+cards.length+'</span>',
    '<div class="flip-dots">'+dots+'</div>',
    '<button class="flip-btn" onclick="flipTo(\''+zoneKey+'\','+(idx-1)+')" '+(idx===0?'disabled':'')+'>‹ 上一張</button>',
    '<button class="flip-btn" onclick="flipTo(\''+zoneKey+'\','+(idx+1)+')" '+(idx===cards.length-1?'disabled':'')+'>下一張 ›</button>',
    '</div>',
    '<div class="kcard">',
    '<div class="kcard-top">',
    '<div class="kcard-icon '+c.type+'">'+c.icon+'</div>',
    '<div class="kcard-meta">',
    '<div class="kcard-type '+c.type+'">'+typeLabel+'</div>',
    '<div class="kcard-title">'+c.title+'</div>',
    '</div></div>',
    '<div class="kcard-divider"></div>',
    '<div class="kcard-body">',
    sceneHTML,
    '<div class="kcard-desc">'+c.desc+'</div>',
    '<div class="pc-grid"><div class="pc-col pros"><div class="pc-hdr">✓ 優點</div>'+pros+'</div><div class="pc-col cons"><div class="pc-hdr">! 注意事項</div>'+cons+'</div></div>',
    '</div></div>',
    lastBtnHTML,
    '</div>',
  ].join('');
}
function flipTo(zoneKey,idx){
  const cards=ZONE_CARDS[zoneKey];
  if(!cards)return;
  idx=Math.max(0,Math.min(cards.length-1,idx));
  S.flipIdx[zoneKey]=idx;
  const z=ZONES.find(x=>x.key===zoneKey);
  if(z)renderZone(z);
}

// ─────────────────────────────────────────────
// BOSS BATTLE
// ─────────────────────────────────────────────
function initBossState(k){
  if(!S.bossState[k]||S.bossState[k].done===undefined){
    S.bossState[k]={qIdx:0,done:false,answers:[],showFeedback:false,lastWrong:false};
  }
}
// 啟程渡口：看完卡片直接給鑰匙，不需闖關
function harborComplete(k){
  S.bossCleared.add(k);
  S.visited.add(k);
  const z=ZONES.find(x=>x.key===k);
  showVictory(z);
}

function startBossPhase(k){
  zonePhase='boss';
  initBossState(k);
  const z=ZONES.find(x=>x.key===k);
  if(z)renderZone(z);
  document.getElementById('screen-zone').scrollTop=0;
}

function renderBossArena(z){
  const k=z.key;
  initBossState(k);
  const bs=S.bossState[k];
  const qs=BOSS_QS[k]||[];
  const totalQ=qs.length;

  if(bs.done){
    // Already cleared — show cleared state
    return '<div class="boss-arena" style="text-align:center;padding:24px">'+
      '<div style="font-size:40px;margin-bottom:8px">🏆</div>'+
      '<div style="font-size:16px;font-weight:900;color:#fff;margin-bottom:6px">關主已攻略！</div>'+
      '<div style="font-size:13px;font-weight:700;color:#c0a0ff;line-height:1.7;margin-bottom:16px">'+z.bossWin+'</div>'+
      '<button class="boss-retry-btn" onclick="proceedToDialogue(\''+k+'\')">繼續 → 與島民對話</button>'+
    '</div>';
  }

  const qi=bs.qIdx;
  const q=qs[qi];
  if(!q)return'';

  // HP bar — starts full, drains as questions complete
  const hpPct=Math.round((qi/totalQ)*100);

  // Progress pips
  const pips=qs.map((_,i)=>{
    const st=i<qi?'done-ok':i===qi?'active':'';
    return'<div class="boss-q-pip '+st+'">'+(i<qi?'✓':(i+1))+'</div>';
  }).join('');

  const optsHTML=q.opts.map((o,oi)=>{
    let cls='boss-opt';
    if(bs.showFeedback){
      if(oi===q.correct)cls+=' correct';
      else if(bs.lastWrong&&oi===bs.lastAnswer)cls+=' wrong';
    }
    const disabled=bs.showFeedback?'disabled':'';
    return'<button class="'+cls+'" onclick="bossPick(\''+k+'\','+qi+','+oi+')" '+disabled+'>'+o+'</button>';
  }).join('');

  const fbHTML=bs.showFeedback&&bs.lastWrong?
    '<div class="boss-feedback">'+q.exp+'</div>'+
    '<button class="boss-retry-btn" onclick="bossRetry(\''+k+'\')">🔄 再試一次！</button>':'';
  const correctFbHTML=bs.showFeedback&&!bs.lastWrong?
    '<div class="boss-feedback" style="border-color:rgba(82,184,74,.4);background:rgba(82,184,74,.15);color:#a0ffa0;">✅ 答對了！正在進入下一題...</div>':'';

  return'<div class="boss-arena">'+
    '<div class="boss-title-row">'+
      '<span class="boss-title-badge">⚔️ 關主挑戰</span>'+
      '<span class="boss-title-txt">'+z.bossName+' 的考驗</span>'+
    '</div>'+
    '<div class="boss-hp-row"><span class="boss-hp-lbl">關主血量</span><div class="boss-hp-track"><div class="boss-hp-fill" style="width:'+(100-hpPct)+'%"></div></div></div>'+
    '<div class="boss-progress-row">'+pips+'<span class="boss-q-lbl">第 '+(qi+1)+'/'+totalQ+' 題</span></div>'+
    '<div class="boss-fight-row">'+
      '<div class="boss-npc-wrap">'+npcSVG(z.bossAv,0,72)+'</div>'+
      '<div class="boss-speech-wrap">'+
        '<div class="boss-speech">'+
          '<div class="boss-npc-name">'+z.bossName+'</div>'+
          '<div class="boss-q">'+(qi===0?z.bossIntro+' 第一題：':'')+q.q+'</div>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="boss-opts">'+optsHTML+'</div>'+
    fbHTML+correctFbHTML+
  '</div>';
}

function bossPick(k,qi,oi){
  const qs=BOSS_QS[k]||[];
  const q=qs[qi];
  if(!q)return;
  const bs=S.bossState[k];
  const correct=oi===q.correct;
  bs.lastAnswer=oi;
  bs.lastWrong=!correct;
  bs.showFeedback=true;
  const z=ZONES.find(x=>x.key===k);
  renderZone(z);
  if(correct){
    setTimeout(()=>{
      bs.showFeedback=false;
      bs.qIdx++;
      if(bs.qIdx>=qs.length){
        // BOSS DEFEATED
        bs.done=true;
        S.bossCleared.add(k);
        showVictory(z);
      }else{
        renderZone(z);
      }
    },900);
  }
}
function bossRetry(k){
  const bs=S.bossState[k];
  bs.showFeedback=false;bs.lastWrong=false;
  const z=ZONES.find(x=>x.key===k);
  renderZone(z);
}

function showVictory(z){
  const vo=document.getElementById('victory-overlay');
  document.getElementById('victory-emoji').textContent=z.keyEmoji;
  document.getElementById('victory-title').textContent='🎉 關主攻略！';
  document.getElementById('victory-sub').textContent=z.bossWin;
  document.getElementById('key-reward-icon').textContent=z.keyEmoji;
  document.getElementById('key-reward-txt').textContent='獲得「'+z.keyLabel+'」！';
  const cleared=S.bossCleared.size;
  const remaining=ZONES.length-cleared;
  document.getElementById('key-reward-sub').textContent=remaining>0?
    '還剩 '+remaining+' 個區域待攻略！':'集齊全部鑰匙！決策廣場已解鎖！';
  // Particles
  const pp=document.getElementById('victory-particles');
  pp.innerHTML='';
  const emojis=['🌟','✨','🎊','🗝️','🌸','🎉','💫','🍃'];
  for(let i=0;i<12;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.cssText='left:'+(Math.random()*100)+'%;top:'+(30+Math.random()*60)+'%;animation-delay:'+(Math.random()*1)+'s;animation-duration:'+(1+Math.random())+'s;';
    p.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    pp.appendChild(p);
  }
  vo.style.display='flex';
  document.getElementById('victory-continue-btn').onclick=()=>{
    vo.style.display='none';
    // Mark zone as fully done (no dialogue phase needed anymore)
    S.visited.add(z.key);
    showMap();
  };
}

function proceedToDialogue(k){
  zonePhase='dialogue';
  const z=ZONES.find(x=>x.key===k);
  if(z)renderZone(z);
  document.getElementById('screen-zone').scrollTop=0;
}

// SCREEN ROUTING
// ─────────────────────────────────────────────
function scr(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById('screen-'+id);
  el.classList.add('active');el.scrollTop=0;
}
function startGame(){
  const n=document.getElementById('name-inp').value.trim();
  S.playerName=n||'旅人';
  showMap();
}

function toggleFont(){
  document.body.classList.toggle('large-font');
  document.getElementById('font-btn').textContent=document.body.classList.contains('large-font')?'A 一般':'A+ 大字';
}

function showMap(){
  scr('map');
  document.getElementById('map-pname').textContent='🌿 '+S.playerName;
  document.getElementById('prog-fill').style.width=Math.round(S.bossCleared.size/ZONES.length*100)+'%';
  document.getElementById('prog-lbl').textContent='已攻略 '+S.bossCleared.size+'/'+ZONES.length+' 關';
  document.getElementById('card-cnt').textContent=S.bossCleared.size===ZONES.length?'🎉 全關通關！':'剩 '+(ZONES.length-S.bossCleared.size)+' 關';

  // Key row
  const kr=document.getElementById('key-row');
  const keyHtml=ZONES.map(z=>'<span class="key-icon'+(S.bossCleared.has(z.key)?'':' locked')+'" title="'+z.keyLabel+'">'+z.keyEmoji+'</span>').join('');
  kr.innerHTML='<span class="key-row-lbl">🗝️ 鑰匙：</span>'+keyHtml+'<span class="key-count">'+S.bossCleared.size+'/'+ZONES.length+'</span>';

  const grid=document.getElementById('zone-grid');grid.innerHTML='';
  const plazaLocked=S.bossCleared.size<ZONES.length;
  const all=[...ZONES.map(z=>({...z})),{key:'plaza',label:'決策廣場',emoji:'🧭',cssClass:'plaza',desc:'集滿所有鑰匙後，在這裡分享偏好並產生個人化摘要。',npcs:['小腎｜整理偏好']}];
  all.forEach(z=>{
    const isBossDone=S.bossCleared.has(z.key);
    const isPlazaDone=S.visited.has('plaza');
    const locked=(z.key==='plaza'&&plazaLocked);
    const t=document.createElement('div');
    const tileComplete=(z.key==='plaza'?isPlazaDone:isBossDone);
    t.className='ztile '+(z.cssClass||z.key)+(tileComplete?' done':'')+(locked?' locked':'');
    if(!locked)t.onclick=()=>goZone(z.key);
    let badge='';
    if(z.key==='plaza'){
      badge=plazaLocked?'<span class="zbadge lock">🔒 集滿'+ZONES.length+'把鑰匙後開放</span>':isPlazaDone?'<span class="zbadge done">✓ 摘要已產生</span>':'<span class="zbadge go">🧭 進入廣場 →</span>';
    }else if(isBossDone){
      badge='<span class="zbadge done">✓ 已攻略</span>';
    }else{
      badge='<span class="zbadge boss">⚔️ 闖關</span>';
    }
    const keyTag=isBossDone?'<span style="font-size:18px;margin-left:4px">'+z.keyEmoji+'</span>':'';
    t.innerHTML='<span class="ze">'+z.emoji+'</span>'+keyTag+'<div class="ztile-name">'+z.label+'</div><div class="ztile-desc">'+z.desc+'</div><div class="ztile-npcs">關主：'+(z.bossName||'')+'</div>'+badge;
    grid.appendChild(t);
  });
}

function goZone(k){
  if(k==='plaza'){scr('plaza');renderPlaza();return;}
  const z=ZONES.find(x=>x.key===k);if(!z)return;
  S._currentZone=k;
  scr('zone');
  document.getElementById('zone-title').textContent=z.emoji+' '+z.label;
  const zoneOrder=['harbor','transplant','pd','home_hd','center_hd'];
  const zIdx=zoneOrder.indexOf(k)+1;
  const pb=document.getElementById('zone-progress-bar');
  if(pb){
    const dots=zoneOrder.map((zk,i)=>'<div class="zone-step-dot'+(zk===k?' cur':S.bossCleared.has(zk)?' done':'')+'" title="'+(i+1)+'"></div>').join('');
    pb.innerHTML='<span style="white-space:nowrap">第 '+zIdx+' 站，共 5 站</span><div class="zone-step-dots">'+dots+'</div>';
  }
  // Determine phase: if boss cleared, show cleared; else cards
  zonePhase=S.bossCleared.has(k)?'done':'cards';
  renderZone(z);
}

function renderZone(z){
  const k=z.key;
  const bossDone=S.bossCleared.has(k);

  let html='';
  // Narrative — parse \n for line breaks
  const narrativeLines=z.narrative.split('\n');
  const narrativeHTML=narrativeLines.map(l=>l?'<p style="margin-bottom:8px">'+l+'</p>':'').join('');
  html+='<div class="narrative-board"><div class="narrative-txt">'+narrativeHTML+'</div></div>';

  if(!bossDone){
    if(zonePhase==='boss'){
      html+=renderBossArena(z);
    }else{
      // cards phase
      html+=renderFlipCards(k);
    }
  }else{
    // Boss already cleared — show cleared state
    html+='<div class="phase-banner"><span class="phase-banner-icon">'+z.keyEmoji+'</span><div><div class="phase-banner-txt">關主已攻略！鑰匙已收入背包</div><div class="phase-banner-sub">前往決策廣場，整理你的偏好與想法</div></div></div>';
    html+='<button class="btn-ok" onclick="showMap()" style="margin-top:8px">← 返回地圖</button>';
  }

  document.getElementById('zone-body').innerHTML=html;
}

function renderDialogue(z,done){
  const qH=z.qs.map((q,i)=>{
    const npc=q.npc||{av:'🧑‍⚕️',name:'島民'};
    const optsHTML=q.opts.map(o=>'<button class="opt'+(S.ans[q.key]===o?' sel':'')+'" data-k="'+q.key+'" data-v="'+o+'" onclick="selOpt(this)"'+(done?' disabled':'')+'>'+o+'</button>').join('');
    return'<div class="qa-block"><div class="qa-npc-row"><div class="qa-npc-svg">'+npcSVG(npc.av,i*0.35)+'</div><div class="qa-speech"><div class="qa-npc-name">'+npc.name+'</div><div class="qa-q-txt">'+q.txt+'</div></div></div><div class="qa-opts">'+optsHTML+'</div></div>';
  }).join('');
  const sec='<div class="sec-hdr"><div class="sec-dot" style="background:var(--yellow);border-color:var(--yellow2)"></div><span class="sec-lbl">與島民分享你的想法</span></div>';
  const ft=done?'<div class="done-msg">🌟 本區已完成！如需修改請按右上角「重設本關」</div>':'<button class="btn-ok" id="zok" onclick="doneZone(\''+z.key+'\')" disabled>🍀 完成「'+z.label+'」對話！</button>';
  return sec+qH+ft;
}

function selOpt(btn){
  const k=btn.dataset.k,v=btn.dataset.v;
  S.ans[k]=v;
  document.querySelectorAll('[data-k="'+k+'"]').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  const z=ZONES.find(x=>x.qs.some(q=>q.key===k));
  if(z)chkBtn(z);
}
function chkBtn(z){const b=document.getElementById('zok');if(b)b.disabled=!z.qs.every(q=>S.ans[q.key]);}

function doneZone(k){
  const z=ZONES.find(x=>x.key===k);
  const before={};Object.keys(S.p).forEach(key=>before[key]=S.p[key]);
  applyZone(k,S.ans);
  if(!S._zoneSnap)S._zoneSnap={};
  const diff={};Object.keys(S.p).forEach(key=>{const d=S.p[key]-before[key];if(d!==0)diff[key]=d;});
  S._zoneSnap[k]=diff;
  S.visited.add(k);
  toast('🌟「'+z.label+'」探索完成！');
  setTimeout(()=>showMap(),1500);
}

function renderPlaza(){
  const done=S.visited.has('plaza');

  // Keys collected display
  const keysHTML='<div class="keys-collected-box">'+
    '<div class="keys-collected-title">🗝️ 你收集到的鑰匙</div>'+
    '<div class="keys-row">'+
      ZONES.map(z=>'<div class="key-slot"><span class="key-slot-icon'+(S.bossCleared.has(z.key)?'':' empty')+'">'+z.keyEmoji+'</span><span class="key-slot-lbl">'+z.keyLabel+'</span></div>').join('')+
    '</div>'+
  '</div>';

  // Preference dialogues — grouped by zone
  const dialogueHTML='<div class="sec-hdr"><div class="sec-dot" style="background:var(--pink);border-color:var(--pink2)"></div><span class="sec-lbl">與島民分享你的想法</span></div>'+
    '<div style="font-size:12px;font-weight:700;color:var(--text2);background:rgba(255,255,255,.6);border-radius:10px;padding:10px 14px;margin-bottom:14px;line-height:1.7;">以下問題沒有對錯——誠實選擇最符合你感受的答案，這些回答將用來產生你的個人化摘要。</div>'+
    PLAZA_DIALOGUES.map(g=>{
      // Only show groups whose zone is cleared
      if(!S.bossCleared.has(g.zoneKey))return'';
      const qsHTML=g.qs.map((q,i)=>{
        const npc=q.npc||{av:'🧑‍⚕️',name:'島民'};
        const optsHTML=q.opts.map(o=>'<button class="opt'+(S.ans[q.key]===o?' sel':'')+'" data-k="'+q.key+'" data-v="'+o+'" onclick="plazaSelOpt(this)"'+(done?' disabled':'')+'>'+o+'</button>').join('');
        return'<div class="qa-block"><div class="qa-npc-row"><div class="qa-npc-svg">'+npcSVG(npc.av,i*0.3)+'</div><div class="qa-speech"><div class="qa-npc-name">'+npc.name+'</div><div class="qa-q-txt">'+q.txt+'</div></div></div><div class="qa-opts">'+optsHTML+'</div></div>';
      }).join('');
      return'<div style="margin-bottom:18px">'+
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:6px 12px;background:rgba(255,255,255,.5);border-radius:12px;border-left:4px solid '+g.zoneColor+'">'+
          '<span style="font-size:18px">'+g.zoneEmoji+'</span>'+
          '<span style="font-size:12px;font-weight:900;color:var(--brown)">'+g.zoneLabel+'</span>'+
        '</div>'+qsHTML+'</div>';
    }).join('');

  const valHTML='<div class="val-grid">'+VOPT.map(v=>{
    const on=S.vals.includes(v),dis=!on&&S.vals.length>=3;
    return'<button class="val-btn'+(on?' val-on':'')+(dis?' val-off':'')+'" onclick="togVal(\''+v+'\')">'+(on?'★ ':'')+v+'</button>';
  }).join('')+'</div>';

  const quizHTML='<div class="quiz-wrap">'+QUIZ.map((q,i)=>{
    const a=S.qans['q'+i];
    return'<div style="margin-bottom:'+(i<QUIZ.length-1?'14px':'0')+'"><div class="quiz-q-txt">'+(i+1)+'. '+q.q+'</div><div class="qbtns">'+
      q.choices.map((c,ci)=>'<button class="qbtn'+(a!==undefined?(ci===q.correct?' qok':ci===a?' qno':''):'')+'" onclick="ansQ('+i+','+ci+')"'+(a!==undefined?' disabled':'')+'>'+c+'</button>').join('')+
      '</div>'+(a!==undefined&&a!==q.correct?'<div class="qfb">'+q.exp+'</div>':'')+'</div>';
  }).join('')+'</div>';

  let rH='';
  if(done){
    const r=evaluate();
    const tagsHTML=(r.tv||[]).map(v=>'<span class="rtag">'+v+'</span>').join('');
    rH='<div class="result-board">'+
        '<div class="result-title">'+r.title+'</div>'+
        '<div class="result-summary">'+r.summary+'</div>'+
        '<div class="result-dir-box"><div class="result-dir-lbl">📍 方向性建議</div><div class="result-dir-txt">'+r.direction+'</div></div>'+
        '<div class="result-advice-box"><div class="result-advice-lbl">🗣️ 下一步行動建議</div><div class="result-advice-txt">'+r.advice+'</div></div>'+
        '<div style="font-size:11px;font-weight:800;color:var(--text3);margin-bottom:6px">你最在意的面向</div>'+
        '<div class="rtags">'+tagsHTML+'</div>'+
        '<div style="font-size:11px;font-weight:800;color:var(--text3);margin:10px 0 6px">可進一步了解的方向</div>'+
        '<div class="result-reco-row"><div class="reco-pill">★ '+r.recs[0]+'</div><div class="reco-pill second">'+r.recs[1]+'</div></div>'+
      '</div>'+
      '<div class="radar-c">'+radarSVG()+'<div class="radar-legend"><div class="radar-legend-dot"></div>你的偏好分布（滿分 6 分）</div><div class="radar-annotation">'+buildRadarAnnotation(r)+'</div></div>'+
      buildFamilyBox(r)+
      '<div class="disclaimer">本結果僅供教育參考，不取代醫師的個別化評估。每種治療方式各有適合的對象，最終請與你的醫療團隊共同討論決定。</div>'+
      '<button class="btn-print" onclick="doPrint()">🖨️ 列印 / 儲存為 PDF</button>'+
      '<button class="btn-dl" onclick="dlSum()">🎀 下載決策摘要</button>';
  }

  // Check if all dialogue answers filled
  const allQKeys=PLAZA_DIALOGUES.flatMap(g=>S.bossCleared.has(g.zoneKey)?g.qs.map(q=>q.key):[]);
  const allAnswered=allQKeys.every(k=>S.ans[k]);

  document.getElementById('plaza-body').innerHTML=
    keysHTML+
    dialogueHTML+
    '<div class="sec-hdr"><div class="sec-dot" style="background:var(--yellow);border-color:var(--yellow2)"></div><span class="sec-lbl">你最在意的事（選最多 3 項）</span></div>'+
    valHTML+
    '<div class="sec-hdr"><div class="sec-dot" style="background:var(--green);border-color:var(--green2)"></div><span class="sec-lbl">理解確認</span></div>'+
    quizHTML+
    (!done?'<button class="btn-ok" onclick="donePlaza()" id="plaza-submit-btn" style="margin-top:14px" '+(allAnswered?'':'disabled')+'>🌟 產生我的決策摘要！</button>':'')+
    '<div id="result" style="margin-top:20px">'+rH+'</div>';
}

function plazaSelOpt(btn){
  const k=btn.dataset.k,v=btn.dataset.v;
  S.ans[k]=v;
  document.querySelectorAll('[data-k="'+k+'"]').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  // Check if all answered to enable submit btn
  const allQKeys=PLAZA_DIALOGUES.flatMap(g=>S.bossCleared.has(g.zoneKey)?g.qs.map(q=>q.key):[]);
  const allAnswered=allQKeys.every(key=>S.ans[key]);
  const sb=document.getElementById('plaza-submit-btn');
  if(sb)sb.disabled=!allAnswered;
}

function togVal(v){if(S.visited.has('plaza'))return;const i=S.vals.indexOf(v);if(i>=0)S.vals.splice(i,1);else if(S.vals.length<3)S.vals.push(v);else return;renderPlaza();}
function ansQ(qi,ci){if(S.qans['q'+qi]!==undefined)return;S.qans['q'+qi]=ci;renderPlaza();}
function donePlaza(){
  // Apply all zone preference scores from plaza dialogues
  ZONES.forEach(z=>{
    if(S.bossCleared.has(z.key)){
      const before={};Object.keys(S.p).forEach(key=>before[key]=S.p[key]);
      applyZone(z.key,S.ans);
      if(!S._zoneSnap)S._zoneSnap={};
      const diff={};Object.keys(S.p).forEach(key=>{const d=S.p[key]-before[key];if(d!==0)diff[key]=d;});
      S._zoneSnap[z.key]=diff;
    }
  });
  // Apply value selections
  const m={'安心感與醫護支持':'medical_support','生活彈性':'flexibility','自主參與':'autonomy','減少打針或看到血的不安':'fear_needles','家庭支持':'family_support','居家安排可行性':'home_feasibility','我還需要更多資訊':'need_more_info'};
  S.vals.forEach(v=>{if(m[v])S.p[m[v]]++;});
  S.visited.add('plaza');
  toast('🎉 你的摘要已產生！');
  setTimeout(()=>renderPlaza(),400);
}

// ─────────────────────────────────────────────
// RADAR & ANALYSIS
// ─────────────────────────────────────────────
function radarSVG(){
  const p=S.p;
  const ax=[
    {l:'醫護支持',v:Math.min(p.medical_support+p.interest_center_hd,6)},
    {l:'自主參與',v:Math.min(p.autonomy+p.interest_pd,6)},
    {l:'生活彈性',v:Math.min(p.flexibility+p.interest_home_hd,6)},
    {l:'家庭支持',v:Math.min(p.family_support+p.home_feasibility,6)},
    {l:'移植傾向',v:Math.min(p.interest_transplant+p.long_term_adherence,6)},
  ];
  const N=ax.length,cx=150,cy=150,R=90,max=6;
  const ang=i=>(Math.PI*2/N)*i-Math.PI/2;
  const pt=(i,r)=>[cx+r*Math.cos(ang(i)),cy+r*Math.sin(ang(i))];
  let g='';
  [2,4,6].forEach(v=>{
    const r=R*(v/max);const pts=ax.map((_,i)=>pt(i,r).join(',')).join(' ');
    g+='<polygon points="'+pts+'" fill="none" stroke="#c8c0a0" stroke-width="0.8" stroke-dasharray="'+(v<6?'3,2':'none')+'"/>';
    const [lx,ly]=pt(0,r);
    g+='<text x="'+(lx+6)+'" y="'+ly+'" font-size="9" fill="#a09070" font-family="Nunito,sans-serif" dominant-baseline="central">'+v+'</text>';
  });
  g+='<text x="'+(cx+5)+'" y="'+cy+'" font-size="9" fill="#c8b898" font-family="Nunito,sans-serif" dominant-baseline="central">0</text>';
  g+=ax.map((_,i)=>{const[x,y]=pt(i,R);return'<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="#c8c0a0" stroke-width="1"/>';}).join('');
  const dataPts=ax.map((a,i)=>pt(i,R*(a.v/max)).join(',')).join(' ');
  g+='<polygon points="'+dataPts+'" fill="rgba(43,181,160,.25)" stroke="#2bb5a0" stroke-width="2"/>';
  g+=ax.map((a,i)=>{const[x,y]=pt(i,R*(a.v/max));return'<circle cx="'+x+'" cy="'+y+'" r="5" fill="#2bb5a0" stroke="white" stroke-width="1.5"/><text x="'+x+'" y="'+(y-10)+'" text-anchor="middle" font-size="9" fill="#1d8c7a" font-family="Nunito,sans-serif" font-weight="700">'+a.v+'</text>';}).join('');
  g+=ax.map((a,i)=>{const[x,y]=pt(i,R+22);return'<text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#6b4c28" font-family="Nunito,sans-serif" font-weight="700">'+a.l+'</text>';}).join('');
  return'<svg width="300" height="300" viewBox="0 0 300 300" style="background:#fff8e8;border-radius:16px;border:3px solid #c8c0a0">'+g+'</svg>';
}
function buildRadarAnnotation(r){
  const p=S.p;
  const axes=[{label:'醫護支持',v:Math.min(p.medical_support+p.interest_center_hd,6),hint:'你比較重視在醫院有人照顧'},{label:'自主參與',v:Math.min(p.autonomy+p.interest_pd,6),hint:'你傾向自己掌握治療'},{label:'生活彈性',v:Math.min(p.flexibility+p.interest_home_hd,6),hint:'你希望治療配合生活節奏'},{label:'家庭支持',v:Math.min(p.family_support+p.home_feasibility,6),hint:'家人支持對你的選擇很重要'},{label:'移植傾向',v:Math.min(p.interest_transplant+p.long_term_adherence,6),hint:'你對腎臟移植有較高期待'}];
  const top=axes.reduce((a,b)=>a.v>=b.v?a:b);
  if(top.v===0)return'完成更多關卡後，雷達圖會顯示你的偏好分布。';
  return'你的雷達圖顯示：<strong>'+top.label+'</strong>分數最高（'+top.v+' 分）——'+top.hint+'。這與「'+r.recs[0]+'」的特性相符。';
}
function buildFamilyBox(r){
  const qmap={'腎臟移植':['什麼條件才能接受腎臟移植評估？','等待期間需要進行什麼透析？','移植後的回診頻率是多久一次？'],'腹膜透析':['換液操作需要多長時間學會？','家裡需要準備什麼樣的空間？','如果出現腹膜炎，要怎麼處理？'],'居家血液透析':['設備安裝評估要找誰聯繫？','家人需要學習哪些操作步驟？','遠端監測是如何進行的？'],'醫療院所血液透析':['可以選擇透析的時段嗎？','有申請交通補助的方式嗎？','如果以後想換透析方式，可以嗎？'],'mixed':['不同治療方式，主要的生活差異是什麼？','如何知道自己適合哪一種？','可以先試試看再決定嗎？']};
  const qs=qmap[r.style]||qmap.mixed;
  return'<div class="family-box"><div class="family-box-title">👨‍👩‍👧 給家人的說明</div><div class="family-box-body">這份摘要顯示，<strong>'+S.playerName+'</strong>目前'+r.title.replace('你','他/她')+'。<br>下次門診時，可以帶著這份摘要，請醫師或護理師說明以下問題：</div><div class="family-questions">'+qs.map(q=>'<div class="family-q">'+q+'</div>').join('')+'</div></div>';
}

// ─────────────────────────────────────────────
// PRINT / DOWNLOAD
// ─────────────────────────────────────────────
function doPrint(){
  const r=evaluate();
  const pa=document.getElementById('print-area');
  pa.innerHTML='<div style="font-family:sans-serif;padding:20px;max-width:600px;margin:0 auto">'+
    '<h2 style="color:#2bb5a0;margin-bottom:4px">新腎小島｜個人化決策摘要</h2>'+
    '<p style="color:#888;font-size:13px;margin-bottom:16px">島民：'+S.playerName+'</p>'+
    '<div style="background:#eaf8e4;border-left:4px solid #52b84a;padding:12px 14px;margin-bottom:12px;border-radius:0 8px 8px 0"><div style="font-size:11px;color:#3a9030;font-weight:700;margin-bottom:4px">你目前的狀態</div><div style="font-size:14px;font-weight:700">'+r.title+'</div></div>'+
    '<div style="background:#f5f5f5;padding:12px 14px;border-radius:8px;margin-bottom:10px"><div style="font-size:11px;color:#888;margin-bottom:4px">整體說明</div><div style="font-size:13px">'+r.summary+'</div></div>'+
    '<div style="background:#eaf8e4;padding:12px 14px;border-radius:8px;margin-bottom:10px"><div style="font-size:11px;color:#3a9030;margin-bottom:4px">方向性建議</div><div style="font-size:13px;font-weight:700">'+r.direction+'</div></div>'+
    '<div style="background:#fff8e8;padding:12px 14px;border-radius:8px;margin-bottom:10px"><div style="font-size:11px;color:#c07830;margin-bottom:4px">下一步行動建議</div><div style="font-size:13px">'+r.advice+'</div></div>'+
    buildFamilyBox(r).replace(/class="[^"]*"/g,'')+
    '<p style="font-size:11px;color:#999;margin-top:16px;border-top:1px solid #eee;padding-top:10px">本摘要僅供教育參考，不取代醫師的個別化評估。最終治療方式請與醫療團隊共同討論決定。</p>'+
  '</div>';
  window.print();
}
function dlSum(){
  const r=evaluate();
  const qs=QUIZ.filter((_,i)=>S.qans['q'+i]===QUIZ[i].correct).length;
  const visited=Object.keys(ZONE_CARDS).filter(k=>S.visited.has(k)).map(k=>({transplant:'腎臟移植',pd:'腹膜透析',home_hd:'居家血液透析',center_hd:'醫療院所血液透析'}[k]||k));
  const fqmap={'腎臟移植':['什麼條件才能接受腎臟移植評估？','等待期間需要進行什麼透析？'],'腹膜透析':['換液操作需要多長時間學會？','家裡需要準備什麼樣的空間？'],'居家血液透析':['設備安裝評估要找誰聯繫？','家人需要學習哪些操作步驟？'],'醫療院所血液透析':['可以選擇透析的時段嗎？','有申請交通補助的方式嗎？'],'mixed':['不同治療方式，主要的生活差異是什麼？','如何知道自己適合哪一種？']};
  const fqs=fqmap[r.style]||fqmap.mixed;
  const bossCleared=ZONES.filter(z=>S.bossCleared.has(z.key)).map(z=>z.keyEmoji+' '+z.keyLabel).join('、');
  const ln=['新腎小島｜個人化決策摘要（闖關版）','='.repeat(30),'島民稱呼：'+S.playerName,'收集鑰匙：'+bossCleared,'','【你目前的狀態】',r.title,'','【整體說明】',r.summary,'','【方向性建議】',r.direction,'','【下一步行動建議】',r.advice,'','【你最在意的面向】',...(r.tv||[]).map(v=>'・'+v),'','【可進一步了解的方向】','・首選：'+r.recs[0],'・也可了解：'+r.recs[1],'','【給家人的說明】',S.playerName+'目前'+r.title.replace('你','他/她')+'。','下次門診可詢問醫師的問題：',...fqs.map(q=>'・'+q),'','='.repeat(30),'⚠ 本摘要僅供教育參考，不取代醫師的個別化評估。'];
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([ln.join('\n')],{type:'text/plain;charset=utf-8'}));
  a.download='新腎小島_'+S.playerName+'_摘要.txt';a.click();
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}
</script>
